<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SWWSHOP — Экосистема</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-orbs"></div>

<!-- РЕДАКТОР БАННЕР -->
<div class="editor-banner" id="editorBanner" onclick="toggleEditorMode()">
  <span class="pulse"></span>
  <span>🔧 Режим редактора · тыкай на товар</span>
</div>

<!-- ХЕДЕР -->
<header class="header">
  <div class="logo">
    <svg class="logo-svg" viewBox="0 0 48 48" fill="none">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00d4ff"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <linearGradient id="logoInner" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(0,212,255,0.25)"/>
          <stop offset="100%" stop-color="rgba(124,58,237,0.08)"/>
        </linearGradient>
      </defs>
      <path d="M24 4 L40 12 V26 C40 36 32 42 24 44 C16 42 8 36 8 26 V12 Z"
            fill="url(#logoInner)" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M18 22 L22 18 L26 22 L30 18" stroke="url(#logoGrad)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M30 28 L26 32 L22 28 L18 32" stroke="url(#logoGrad)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="24" cy="25" r="2" fill="url(#logoGrad)"/>
    </svg>
    <span>SWWSHOP</span>
  </div>
  <div class="header-actions">
    <div class="balance-chip" onclick="navigate('profile')" title="SWWCOIN баланс">
      <div class="coin-icon">₴</div>
      <span class="balance-value" id="headerBalance">0</span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="Тема">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>
  </div>
</header>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<main class="container" id="app">
  <div class="empty-state">
    <div class="icon">⏳</div>
    <h3>Загрузка...</h3>
  </div>
</main>

<!-- НИЖНЯЯ НАВИГАЦИЯ -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-page="catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span>Каталог</span>
  </button>
  <button class="nav-item" data-page="order">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span>Заказать</span>
    <span class="nav-badge" id="cartBadge" style="display:none;">0</span>
  </button>
  <button class="nav-item" data-page="roulette">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/>
    </svg>
    <span>Рулетка</span>
  </button>
  <button class="nav-item" data-page="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Профиль</span>
  </button>
</nav>

<!-- ОВЕРЛЕЙ: КОРЗИНА -->
<div class="overlay" id="cartOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>🛒 Корзина</h2>
      <button class="modal-close" onclick="closeOverlay('cartOverlay')">✕</button>
    </div>
    <div id="cartContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: МОИ ЗАКАЗЫ -->
<div class="overlay" id="ordersOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>📋 Мои заказы</h2>
      <button class="modal-close" onclick="closeOverlay('ordersOverlay')">✕</button>
    </div>
    <div id="ordersContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: ДЕТАЛИ ЗАКАЗА -->
<div class="overlay" id="orderDetailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="orderDetailTitle">📦 Заказ</h2>
      <button class="modal-close" onclick="closeOverlay('orderDetailOverlay')">✕</button>
    </div>
    <div id="orderDetailContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: МОИ СКИДКИ -->
<div class="overlay" id="promosOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>🎫 Мои скидки</h2>
      <button class="modal-close" onclick="closeOverlay('promosOverlay')">✕</button>
    </div>
    <div id="promosContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: КОНТАКТЫ -->
<div class="overlay" id="contactEditorOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>📞 Контакты</h2>
      <button class="modal-close" onclick="closeOverlay('contactEditorOverlay')">✕</button>
    </div>
    <div id="contactEditorContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: АДМИНКА -->
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>👑 Админ-панель</h2>
      <button class="modal-close" onclick="closeOverlay('adminOverlay')">✕</button>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: ВСЕ ЗАКАЗЫ -->
<div class="overlay" id="allOrdersOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>📋 Все заказы</h2>
      <button class="modal-close" onclick="closeOverlay('allOrdersOverlay')">✕</button>
    </div>
    <div id="allOrdersContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: КОНСОЛЬ -->
<div class="overlay" id="consoleOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>💬 Консоль</h2>
      <button class="modal-close" onclick="closeOverlay('consoleOverlay')">✕</button>
    </div>
    <div id="consoleContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: ПОЛЬЗОВАТЕЛИ -->
<div class="overlay" id="usersOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>👥 Пользователи</h2>
      <button class="modal-close" onclick="closeOverlay('usersOverlay')">✕</button>
    </div>
    <div id="usersContent"></div>
  </div>
</div>

<!-- ОВЕРЛЕЙ: РЕДАКТОР ТОВАРА -->
<div class="overlay" id="editProductOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>🔧 Редактор товара</h2>
      <button class="modal-close" onclick="closeOverlay('editProductOverlay')">✕</button>
    </div>
    <div id="editProductContent"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastText">Готово</span>
</div>

<script src="app.js"></script>
</body>
</html>

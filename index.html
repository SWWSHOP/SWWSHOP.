<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SWWSHOP — Ассортимент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --accent: #0078ff;
      --border: #e0e0e0;
      --success: #2ecc71;
      --danger: #e74c3c;
      --warning: #f39c12;
      --admin-bg: #f4f6f8;
      --admin-border: #d1d5db;
      --card-bg: #f9f9f9;
      --card-active: #eeeeee;
    }
    
    body.dark {
      --bg: #1a1a1a;
      --text: #ffffff;
      --accent: #4da3ff;
      --border: #333333;
      --admin-bg: #2a2a2a;
      --admin-border: #444444;
      --card-bg: #2a2a2a;
      --card-active: #3a3a3a;
    }
    
    body.telegram {
      --bg: #18222d;
      --text: #ffffff;
      --accent: #5ea3d9;
      --border: #1f2d3d;
      --admin-bg: #1e2a38;
      --admin-border: #2a3a4a;
      --card-bg: #1e2a38;
      --card-active: #253545;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    .container { flex: 1; overflow-y: auto; padding: 12px 12px 80px; }
    h1 { margin: 16px 0 12px; font-size: 20px; text-align: center; }
    .shop-title { text-transform: uppercase; color: var(--accent); font-weight: 700; }
    
    /* Иконки категорий */
    .cat-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      margin-right: 10px;
      vertical-align: middle;
    }
    
    .category-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      text-align: left;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
    }
    .category-btn:active { background: var(--card-active); }
    .category-btn svg { margin-right: 12px; flex-shrink: 0; }
    
    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 4px;
    }
    .product-name { font-weight: 500; max-width: 50%; min-width: 100px; }
    .product-price { font-weight: 600; color: var(--accent); }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
    .status-in-stock { background: rgba(46,204,113,0.15); color: var(--success); }
    .status-out-stock { background: rgba(231,76,60,0.15); color: var(--danger); }
    .back-btn {
      margin-bottom: 8px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
    }
    .flavor-row {
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title { margin-top: 16px; margin-bottom: 8px; font-weight: 600; font-size: 15px; }
    
    .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn-sm {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: white;
      font-weight: 500;
    }
    .btn-delete { background: var(--danger); }
    .btn-toggle { background: var(--warning); }
    .btn-delete-line {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    .btn-delete-flavor {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
    }

    .admin-panel {
      background: var(--admin-bg);
      padding: 16px;
      border-radius: 12px;
      position: fixed;
      bottom: 80px;
      left: 12px;
      right: 12px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      display: none;
    }
    .admin-panel.active { display: block; }
    .admin-login-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
    }
    .admin-btn {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .admin-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 500px) { .admin-controls { grid-template-columns: 1fr; } }
    .admin-control-group {
      border: 1px solid var(--admin-border);
      padding: 12px;
      border-radius: 8px;
      background: var(--card-bg);
      margin-bottom: 12px;
    }
    .admin-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: block; opacity: 0.8; }
    .admin-textarea {
      width: 100%;
      height: 60px;
      resize: vertical;
      padding: 8px;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      margin-bottom: 8px;
      font-family: inherit;
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text);
    }
    .admin-action-btn {
      width: 100%;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-dark { background: #333; }
    .btn-red { background: var(--danger); }
    .btn-orange { background: var(--warning); }
    .admin-logout-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    
    /* Кнопка админа с SVG замком */
    .admin-toggle-btn {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 50%;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,170,0,0.4);
      z-index: 999;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .admin-toggle-btn:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(255,170,0,0.3); }
    .admin-toggle-btn svg { width: 28px; height: 28px; }
    
    /* Переключатель темы */
    .theme-switcher {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 6px;
      z-index: 999;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: all 0.2s;
      padding: 0;
    }
    .theme-btn svg { width: 18px; height: 18px; }
    .theme-btn.active {
      border-color: var(--accent);
      background: rgba(0,120,255,0.15);
    }
    .theme-btn:hover { opacity: 0.8; }
    
    .delete-section { border: 2px solid var(--danger) !important; }
    .delete-select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: var(--card-bg);
      color: var(--text);
    }
    .admin-indicator {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #333;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1001;
      display: none;
    }
    .admin-indicator.active { display: block; }
  </style>
</head>
<body class="telegram">
  <div class="admin-indicator" id="admin-indicator">АДМИН</div>
  <div class="container" id="app"><p style="text-align:center;padding:40px;">Загрузка...</p></div>

  <!-- Переключатель темы с SVG иконками -->
  <div class="theme-switcher">
    <button class="theme-btn active" onclick="setTheme('telegram')" title="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </button>
    <button class="theme-btn" onclick="setTheme('light')" title="Светлая">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="theme-btn" onclick="setTheme('dark')" title="Тёмная">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>

  <!-- Кнопка админа - ЗАМОК С КЛЮЧОМ -->
  <button class="admin-toggle-btn" onclick="toggleAdminPanel()" title="Админ-панель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Замок -->
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="#333" stroke="#333"/>
      <path d="M7 11V7a5 5 0 0110 0v4" stroke="#333"/>
      <circle cx="12" cy="16" r="1" fill="#ffd700" stroke="#ffd700"/>
      <!-- Ключ -->
      <circle cx="18" cy="5" r="2" fill="#ffd700" stroke="#ffd700"/>
      <path d="M18 7v4l-3 3" stroke="#ffd700"/>
      <path d="M15 14l-1 1" stroke="#ffd700"/>
    </svg>
  </button>

  <div id="admin-panel" class="admin-panel">
    <h2 class="shop-title">Админ-панель</h2>
    
    <div id="admin-login-area">
      <p style="font-size:12px;color:var(--text);opacity:0.7;margin-bottom:16px;">Введите пароль</p>
      <div class="admin-login-form">
        <input type="password" id="admin-password" class="admin-input" placeholder="Пароль" onkeypress="if(event.key==='Enter')adminLogin()" />
        <button class="admin-btn" onclick="adminLogin()">Войти</button>
      </div>
    </div>
    
    <div id="admin-controls-area" style="display:none;">
      <div class="admin-controls">
        <div class="admin-control-group">
          <span class="admin-label">Добавить линейку</span>
          <input type="text" id="line-name" class="admin-input" placeholder="Название" />
          <input type="number" id="line-price" class="admin-input" placeholder="Цена" />
          <select id="line-category" class="admin-input">
            <option value="liquids">Жидкости</option>
            <option value="pouches">Шайбы</option>
          </select>
          <textarea id="line-flavors" class="admin-textarea" placeholder="Вкус,YES&#10;Вкус,NO"></textarea>
          <button class="admin-action-btn btn-dark" onclick="addLine()">Добавить</button>
        </div>
        
        <div class="admin-control-group">
          <span class="admin-label">Добавить товар</span>
          <input type="text" id="item-name" class="admin-input" placeholder="Название" />
          <input type="number" id="item-price" class="admin-input" placeholder="Цена" />
          <select id="item-category" class="admin-input">
            <option value="coils">Испарители</option>
            <option value="devices">Устройства</option>
          </select>
          <input type="number" id="item-qty" class="admin-input" placeholder="Кол-во" />
          <button class="admin-action-btn btn-dark" onclick="addItem()">Добавить</button>
        </div>
      </div>
      
      <div class="admin-control-group delete-section">
        <span class="admin-label" style="color:var(--danger);">Удаление</span>
        <select id="del-category" class="delete-select" onchange="updateDelSelect()">
          <option value="liquids">Жидкости</option>
          <option value="pouches">Шайбы</option>
          <option value="coils">Испарители</option>
          <option value="devices">Устройства</option>
        </select>
        <select id="del-item" class="delete-select">
          <option value="">-- Выберите --</option>
        </select>
        <button class="admin-action-btn btn-red" onclick="deleteSelected()">Удалить</button>
        <button class="admin-action-btn btn-orange" onclick="deleteAllOutOfStock()">Удалить всё что закончилось</button>
      </div>
      
      <button class="admin-logout-btn" onclick="adminLogout()">Выйти</button>
    </div>
  </div>

  <script>
    // ============ ТЕМА ============
    function setTheme(theme) {
      document.body.className = theme;
      localStorage.setItem('swwshop_theme', theme);
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[onclick="setTheme('${theme}')"]`)?.classList.add('active');
    }
    
    const savedTheme = localStorage.getItem('swwshop_theme') || 'telegram';
    setTheme(savedTheme);
    
    // ============ SVG ИКОНКИ КАТЕГОРИЙ ============
    const categoryIcons = {
      liquids: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L8 8h8l-4-6z" fill="rgba(0,150,255,0.2)" stroke="#0096ff"/>
        <path d="M8 8v12a2 2 0 002 2h4a2 2 0 002-2V8" stroke="currentColor"/>
        <path d="M10 12v4M14 12v4" stroke="#0096ff" stroke-width="1"/>
        <circle cx="12" cy="5" r="1.5" fill="#0096ff"/>
      </svg>`,
      
      pouches: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="10" r="6" fill="rgba(255,150,0,0.2)" stroke="#ff9600"/>
        <circle cx="12" cy="10" r="2" fill="#ff9600"/>
        <path d="M9 7c-1-3 1-5 3-5s4 2 3 5" stroke="currentColor"/>
        <path d="M7 16h10l-1 6H8l-1-6z" fill="rgba(255,150,0,0.1)" stroke="#ff9600"/>
      </svg>`,
      
      coils: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9" fill="rgba(150,150,150,0.2)" stroke="#969696"/>
        <circle cx="12" cy="12" r="5" stroke="#666"/>
        <circle cx="12" cy="12" r="1" fill="#666"/>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor"/>
      </svg>`,
      
      devices: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="2" width="16" height="13" rx="2" fill="rgba(100,200,100,0.2)" stroke="#64c864"/>
        <rect x="6" y="4" width="12" height="9" rx="1" stroke="currentColor"/>
        <path d="M9 17h6l1 3H8l1-3z" stroke="currentColor"/>
        <circle cx="12" cy="19.5" r="1.5" fill="#64c864"/>
      </svg>`
    };
    
    // ============ FIREBASE ============
    const firebaseConfig = {
      apiKey: "AIzaSyDEMDoBe8qtBcKUzmPlOLStCwn21_x5SBQ",
      authDomain: "swwshop.firebaseapp.com",
      databaseURL: "https://swwshop-default-rtdb.firebaseio.com",
      projectId: "swwshop",
      storageBucket: "swwshop.firebasestorage.app",
      messagingSenderId: "698268675105",
      appId: "1:698268675105:web:15814d169ee2e74c8e4760"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let data = { liquids: [], pouches: [], coils: [], devices: [] };
    let isAdmin = false;
    let currentView = 'main';
    let currentCategory = '';
    let currentIndex = 0;

    db.ref('assortment').on('value', (snap) => {
      const val = snap.val();
      if (val && val.liquids) {
        data = val;
        refreshView();
      } else {
        const init = {
          liquids: [
            {
              name: 'ALFA VAPE 50MG',
              price: 350,
              flavors: [
                { name: 'Черничный лимонад', inStock: false },
                { name: 'Персик манго', inStock: true },
                { name: 'Вишневая кола', inStock: false },
                { name: 'Манго пинаколада', inStock: true },
                { name: 'Мармеладные мишки', inStock: true },
                { name: 'Леденцы лимонные', inStock: true },
                { name: 'Клубнично-банановая жвачка', inStock: true },
                { name: 'Энергетик киви яблоко', inStock: true },
                { name: 'Ананас малина', inStock: true },
                { name: 'Ягодный микс', inStock: false }
              ]
            },
            {
              name: 'ISTERIKA CLASSIC 70MG',
              price: 600,
              flavors: [
                { name: 'Ананас ежевика', inStock: true },
                { name: 'Арбузные леденцы', inStock: true },
                { name: 'Ежевичный мармелад', inStock: true },
                { name: 'Зелёный Бёрн', inStock: true },
                { name: 'Клубника банан дыня', inStock: true },
                { name: 'Клубника драгонфрут', inStock: true },
                { name: 'Клубника малиновое варенье', inStock: true },
                { name: 'Кола чупа чупс', inStock: true },
                { name: 'Лимонад черника', inStock: true },
                { name: 'Маракуйя грейпфрут', inStock: true },
                { name: 'Персик зеленый виноград', inStock: true },
                { name: 'Фруктовые мармеладные мишки', inStock: true },
                { name: 'Черная смородина груша', inStock: true },
                { name: 'Экзотик микс', inStock: true },
                { name: 'Яблоко лесной микс', inStock: true }
              ]
            }
          ],
          pouches: [
            {
              name: 'GLITCH POUCHES 200MG',
              price: 500,
              flavors: [
                { name: 'Груша', inStock: true },
                { name: 'Фанта', inStock: true },
                { name: 'Баблгам', inStock: true }
              ]
            },
            {
              name: 'ICEBERG EXTREME 150MG',
              price: 500,
              flavors: [
                { name: 'Манго банан', inStock: true }
              ]
            }
          ],
          coils: [
            { name: 'XROS 0.6-0.4', price: 330, inStock: true },
            { name: 'Hero 50-58W', price: 330, inStock: true },
            { name: 'Pasito K5', price: 330, inStock: true }
          ],
          devices: []
        };
        db.ref('assortment').set(init);
      }
    });

    function saveToDB() { db.ref('assortment').set(data); }

    function refreshView() {
      if (currentView === 'main') showMain();
      else if (currentView === 'category') showCategory(currentCategory);
      else if (currentView === 'detail') showDetail(currentCategory, currentIndex);
    }

    function stText(s) { return s ? 'В наличии' : 'Нет'; }
    function stClass(s) { return s ? 'status-in-stock' : 'status-out-stock'; }
    
    function showMain() {
      currentView = 'main';
      document.getElementById('app').innerHTML = `
        <h1 class="shop-title">SWWSHOP</h1>
        <p style="text-align:center;opacity:0.7;margin-bottom:16px;">Выберите категорию:</p>
        <button class="category-btn" onclick="showCategory('liquids')">
          ${categoryIcons.liquids} Жидкости
        </button>
        <button class="category-btn" onclick="showCategory('pouches')">
          ${categoryIcons.pouches} Шайбы
        </button>
        <button class="category-btn" onclick="showCategory('coils')">
          ${categoryIcons.coils} Испарители
        </button>
        <button class="category-btn" onclick="showCategory('devices')">
          ${categoryIcons.devices} Устройства
        </button>
      `;
    }

    function showCategory(cat) {
      currentView = 'category';
      currentCategory = cat;
      const titles = { liquids:'Жидкости', pouches:'Шайбы', coils:'Испарители', devices:'Устройства' };
      
      let h = '<button class="back-btn" onclick="showMain()">← Назад</button>';
      h += `<h1 class="shop-title">${titles[cat]}</h1>`;
      
      if (!data[cat] || data[cat].length === 0) {
        h += '<p style="text-align:center;opacity:0.5;">Нет товаров</p>';
      } else if (cat === 'liquids' || cat === 'pouches') {
        data[cat].forEach((line, i) => {
          const hasStock = line.flavors && line.flavors.some(f => f.inStock);
          h += `<div style="margin-bottom:8px;">
            <button class="category-btn" onclick="showDetail('${cat}',${i})">
              <div style="flex:1;"><strong>${line.name}</strong></div>
              <div style="font-size:13px;opacity:0.7;">${line.price} RUB | ${line.flavors.length} вкусов | ${hasStock ? 'Есть' : 'Нет'}</div>
            </button>
            ${isAdmin ? `<button class="btn-delete-line" onclick="event.stopPropagation(); deleteLine('${cat}',${i})">Удалить</button>` : ''}
          </div>`;
        });
      } else {
        data[cat].forEach((item, i) => {
          h += `<div class="product-row">
            <span class="product-name">${item.name}</span>
            <span class="product-price">${item.price} RUB</span>
            <span class="status-badge ${stClass(item.inStock)}">${stText(item.inStock)}</span>
            ${isAdmin ? `<div class="action-btns">
              <button class="btn-sm btn-toggle" onclick="toggleItem('${cat}',${i})">Сменить</button>
              <button class="btn-sm btn-delete" onclick="deleteItem('${cat}',${i})">Удалить</button>
            </div>` : ''}
          </div>`;
        });
      }
      
      document.getElementById('app').innerHTML = h;
    }

    function showDetail(cat, idx) {
      currentView = 'detail';
      currentCategory = cat;
      currentIndex = idx;
      const line = data[cat][idx];
      
      let h = `<button class="back-btn" onclick="showCategory('${cat}')">← Назад</button>`;
      h += `<h1 class="shop-title">${line.name}</h1>`;
      h += `<p style="text-align:center;color:var(--accent);font-weight:600;font-size:18px;">${line.price} RUB</p>`;
      h += `<div class="section-title">Вкусы (${line.flavors.length}):</div>`;
      
      line.flavors.forEach((flavor, fi) => {
        h += `<div class="flavor-row">
          <span>${flavor.name}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="status-badge ${stClass(flavor.inStock)}">${stText(flavor.inStock)}</span>
            ${isAdmin ? `
              <button class="btn-sm btn-toggle" onclick="toggleFlavor('${cat}',${idx},${fi})">Сменить</button>
              <button class="btn-delete-flavor" onclick="deleteFlavor('${cat}',${idx},${fi})">X</button>
            ` : ''}
          </div>
        </div>`;
      });
      
      document.getElementById('app').innerHTML = h;
    }

    function deleteLine(cat, idx) {
      if (!isAdmin) return;
      if (confirm(`Удалить "${data[cat][idx].name}"?`)) {
        data[cat].splice(idx, 1);
        saveToDB();
        updateDelSelect();
        showCategory(cat);
      }
    }

    function deleteItem(cat, idx) {
      if (!isAdmin) return;
      if (confirm(`Удалить "${data[cat][idx].name}"?`)) {
        data[cat].splice(idx, 1);
        saveToDB();
        updateDelSelect();
        showCategory(cat);
      }
    }

    function deleteFlavor(cat, lineIdx, flIdx) {
      if (!isAdmin) return;
      if (confirm(`Удалить вкус?`)) {
        data[cat][lineIdx].flavors.splice(flIdx, 1);
        saveToDB();
        showDetail(cat, lineIdx);
      }
    }

    function toggleItem(cat, idx) {
      if (!isAdmin) return;
      data[cat][idx].inStock = !data[cat][idx].inStock;
      saveToDB();
      showCategory(cat);
    }

    function toggleFlavor(cat, lineIdx, flIdx) {
      if (!isAdmin) return;
      data[cat][lineIdx].flavors[flIdx].inStock = !data[cat][lineIdx].flavors[flIdx].inStock;
      saveToDB();
      showDetail(cat, lineIdx);
    }

    function toggleAdminPanel() {
      document.getElementById('admin-panel').classList.toggle('active');
      if (document.getElementById('admin-panel').classList.contains('active')) updateDelSelect();
    }

    function updateIndicator() {
      document.getElementById('admin-indicator').className = isAdmin ? 'admin-indicator active' : 'admin-indicator';
    }

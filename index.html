<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SWW SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Переменные будут перезаписаны JS под тему Telegram */
    :root {
      --bg-color: #f5f5f7;
      --surface-color: #ffffff;
      --text-color: #111111;
      --secondary-text-color: #888888;
      --primary-color: #2481cc;
      --danger-color: #d32f2f;
      --success-color: #388e3c;
      --border-radius: 12px;
    }

    .tg-viewport {
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--text-color);
    }
    .category-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--border-radius);
      background: var(--surface-color);
      color: var(--text-color);
      text-align: left;
      font-size: 16px;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
      margin-bottom: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .category-btn:active {
      opacity: 0.85;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-color);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      padding: 14px 16px;
      border-radius: var(--border-radius);
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      cursor: pointer;
    }
    .product-name {
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-color);
    }
    .product-price {
      font-weight: 700;
      color: var(--primary-color);
    }
    .status-badge {
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
    }
    .status-in-stock {
      background-color: var(--success-color);
    }
    .status-out-of-stock {
      background-color: var(--danger-color);
    }
    .flavor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--surface-color);
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--secondary-text-color);
    }
    .cart-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: var(--surface-color);
      box-shadow: 0 -4px 12px rgba(0,0,0,.1);
      z-index: 10;
    }
    .cart-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--text-color);
    }
    .promo-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--secondary-text-color);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      background: var(--bg-color);
      color: var(--text-color);
    }
    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .order-result {
      padding: 20px;
      text-align: center;
      display: none;
      color: var(--text-color);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="tg-viewport">
  <div class="container">
    <h1>Ассортимент</h1>
    <div id="main-menu" class="menu-area">
      <button class="category-btn" data-cat="liquids">Жидкости</button>
      <button class="category-btn" data-cat="pouches">Шайбы</button>
      <button class="category-btn" data-cat="coils">Испарители</button>
      <button class="category-btn" data-cat="devices">Устройства</button>
    </div>

    <!-- Список товаров категории -->
    <div id="category-list" class="hidden"></div>

    <!-- Вкусы/позиции товара -->
    <div id="flavors-view" class="hidden">
      <button class="back-btn" id="back-from-flavors">← Назад к ассортименту</button>
      <div id="flavors-list"></div>
    </div>
  </div>

  <!-- Корзина и оплата -->
  <div id="cart-section" class="cart-section hidden">
    <div class="cart-info">
      <span id="cart-total-display">Корзина: 0 ₽</span>
      <span id="cart-count-display">0 товаров</span>
    </div>
    <input type="text" id="promo-code" class="promo-input" placeholder="Промокод (если есть)" />
    <button id="checkout-btn" class="checkout-btn">Оформить заказ</button>
  </div>

  <!-- Результат заказа -->
  <div id="order-result" class="order-result">
    <h2>Заказ оформлен!</h2>
    <p>Номер заказа: <strong id="order-number-display"></strong></p>
    <p id="order-details-display"></p>
    <br/>
    <button id="back-to-shop" class="category-btn">Вернуться в магазин</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Применяем цвета темы Telegram
    const theme = tg.themeParams;
    document.documentElement.style.setProperty('--bg-color', theme.bg_color || '#f5f5f7');
    document.documentElement.style.setProperty('--surface-color', theme.secondary_bg_color || theme.bg_color || '#ffffff');
    document.documentElement.style.setProperty('--text-color', theme.text_color || '#111111');
    document.documentElement.style.setProperty('--secondary-text-color', theme.hint_color || '#888888');
    document.documentElement.style.setProperty('--primary-color', theme.button_color || '#2481cc');
    document.documentElement.style.setProperty('--danger-color', '#d32f2f');
    document.documentElement.style.setProperty('--success-color', '#388e3c');

    // --- Данные товаров ---
    const products = {
      liquids: [
        {
          id: 'alfa-50mg',
          name: 'ALFA VAPE 50MG',
          price: 350,
          flavors: [
            { name: 'Черничный лимонад', stock: 0, inStock: false },
            { name: 'Персик манго', stock: 4, inStock: true },
            { name: 'Вишневая кола', stock: 0, inStock: false },
            { name: 'Манго пинаколада', stock: 6, inStock: true },
            { name: 'Мармеладные мишки', stock: 3, inStock: true },
            { name: 'Леденцы лимонные', stock: 7, inStock: true },
            { name: 'Клубнично-банановая жвачка', stock: 2, inStock: true },
            { name: 'Энергетик киви яблоко', stock: 1, inStock: true },
            { name: 'Ананас малина', stock: 3, inStock: true },
            { name: 'Ягодный микс', stock: 0, inStock: false }
          ]
        },
        {
          id: 'isterika-70mg',
          name: 'ISTERIKA CLASSIC 70MG',
          price: 600,
          flavors: [
            { name: 'Ананас ежевика', stock: 1, inStock: true },
            { name: 'Арбузные леденцы', stock: 1, inStock: true },
            { name: 'Ежевичный мармелад', stock: 1, inStock: true },
            { name: 'Зелёный Бёрн', stock: 1, inStock: true },
            { name: 'Клубника банан дыня', stock: 1, inStock: true },
            { name: 'Клубника драгонфрут', stock: 1, inStock: true },
            { name: 'Клубника малиновое варенье', stock: 1, inStock: true },
            { name: 'Кола чупа чупс', stock: 1, inStock: true },
            { name: 'Лимонад черника', stock: 1, inStock: true },
            { name: 'Маракуйя грейпфрут', stock: 1, inStock: true },
            { name: 'Персик зеленый виноград', stock: 0, inStock: false },
            { name: 'Фруктовые мармеладные мишки', stock: 1, inStock: true },
            { name: 'Черная смородина груша', stock: 1, inStock: true },
            { name: 'Экзотик микс', stock: 1, inStock: true },
            { name: 'Яблоко лесной микс', stock: 1, inStock: true }
          ]
        }
      ],
      pouches: [
        {
          id: 'glitch-200mg',
          name: 'GLITCH POUCHES 200MG',
          price: 500,
          flavors: [
            { name: 'Двойное яблоко', stock: 1, inStock: true },
            { name: 'Фанта', stock: 1, inStock: true },
            { name: 'Баблгам', stock: 1, inStock: true }
          ]
        },
        {
          id: 'iceberg-150mg',
          name: 'ICEBERG EXTREME 150MG',
          price: 500,
          flavors: [
            { name: 'Манго банан', stock: 1, inStock: true }
          ]
        }
      ],
      coils: [
        { id: 'xros', name: 'XROS 0.6-0.4', price: 330, stock: 4, inStock: true },
        { id: 'hero', name: 'Hero 50-58W', price: 330, stock: 1, inStock: true },
        { id: 'pasito', name: 'Pasito K5', price: 330, stock: 2, inStock: true }
      ],
      devices: []
    };

    let cart = [];

    function updateCartUI() {
      const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      document.getElementById('cart-total-display').textContent = `Корзина: ${total.toLocaleString()} ₽`;
      document.getElementById('cart-count-display').textContent = `${cart.length} товаров`;
    }

    function addToCart(item) {
      // Уменьшаем остаток
      if (item.stock > 0) {
        item.stock -= 1;
        if (item.stock <= 0) item.inStock = false;
      } else {
        alert('Товар закончился!');
        return;
      }

      const existing = cart.find(c => c.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
      renderCategoryList(); // обновить статусы в каталоге
    }

    function show(id) {
      document.querySelectorAll('.hidden').forEach(el => el.classList.add('hidden'));
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
    }

    // Обработчики кнопок категорий
    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        renderCategoryList(cat);
        show('category-list');
      });
    });

    document.getElementById('back-from-flavors').addEventListener('click', () => {
      show('category-list');
    });

    document.getElementById('back-to-shop').addEventListener('click', () => {
      cart = [];
      updateCartUI();
      show('main-menu');
      document.getElementById('cart-section').classList.add('hidden');
    });

    document.getElementById('checkout-btn').addEventListener('click', () => {
      if (cart.length === 0) {
        alert('Корзина пуста');
        return;
      }
      const promo = document.getElementById('promo-code').value.trim();
      
      // Генерация номера заказа: 9 символов (A-Z, 0-9)
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let orderNumber = '';
      for (let i = 0; i < 9; i++) {
        orderNumber += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      let details = '';
      cart.forEach(item => {
        details += `${item.name} (${item.qty} шт × ${item.price} ₽) = ${item.price * item.qty} ₽\n`;

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SWWSHOP — Ассортимент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --bg-2: #111827;
    --card: #131a26;
    --card-hover: #1a2333;
    --text: #e6edf7;
    --text-dim: #8b98ad;
    --accent: #00d4ff;
    --accent-2: #7c3aed;
    --danger: #ff4d6d;
    --warning: #ffb020;
    --success: #06ffa5;
    --border: #1e2a3d;
  }
  body.light {
    --bg: #f4f7fb;
    --bg-2: #ffffff;
    --card: #ffffff;
    --card-hover: #f0f4fa;
    --text: #0a0e17;
    --text-dim: #64748b;
    --border: #e2e8f0;
  }
  body.winter {
    --bg: #0a1526;
    --bg-2: #0f1e33;
    --card: #132540;
    --card-hover: #1a3050;
    --accent: #4da3ff;
    --accent-2: #7c9cff;
    --border: #1e3a5c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
    padding-bottom: 100px;
  }

  .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-orbs::before, .bg-orbs::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
    animation: float 18s ease-in-out infinite;
  }
  .bg-orbs::before { width: 400px; height: 400px; background: var(--accent); top: -120px; left: -120px; }
  .bg-orbs::after { width: 500px; height: 500px; background: var(--accent-2); bottom: -180px; right: -160px; animation-delay: -9s; }
  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px,-40px) scale(1.15); }
  }

  .snowflake {
    position: fixed; top: -20px; color: #fff; opacity: 0.7;
    pointer-events: none; z-index: 1; font-size: 14px;
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    0% { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(360deg); }
  }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,14,23,0.75);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  body.light .header { background: rgba(244,247,251,0.85); }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }
  .logo-mark {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.25s; color: var(--text);
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,212,255,0.25); }
  .icon-btn:active { transform: scale(0.92); }

  .container { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 16px; }

  .section { margin-bottom: 24px; animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) backwards; }
  .section-title {
    font-size: 17px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: ''; width: 3px; height: 16px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .hero {
    text-align: center; padding: 20px 0;
    animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3);
    color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 30px; margin-bottom: 12px;
  }
  .hero-badge .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .hero h1 {
    font-size: 30px; font-weight: 800; line-height: 1.15;
    margin-bottom: 8px; letter-spacing: -0.5px;
  }
  .hero h1 .grad {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 400px; margin: 0 auto 20px; }

  .cat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px;
    margin-bottom: 10px; cursor: pointer;
    transition: all 0.3s;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .cat-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    opacity: 0; transition: opacity 0.3s;
  }
  .cat-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,212,255,0.15);
  }
  .cat-card:hover::before { opacity: 1; }
  .cat-card:active { transform: scale(0.98); }
  .cat-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .cat-icon {
    width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,58,237,0.15));
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0;
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .cat-desc { font-size: 12px; color: var(--text-dim); }
  .cat-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cat-count {
    font-size: 12px; color: var(--text-dim);
    background: var(--bg-2); padding: 4px 10px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  .cat-arrow { color: var(--text-dim); }

  .product-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  .product-card:hover { border-color: var(--accent); }
  .product-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .product-name { font-size: 15px; font-weight: 700; flex: 1; }
  .product-price {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .product-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status-badge {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
  }
  .status-in-stock { background: rgba(6,255,165,0.15); color: var(--success); }
  .status-out-stock { background: rgba(255,77,109,0.15); color: var(--danger); }
  .status-in-cart { background: rgba(0,212,255,0.15); color: var(--accent); }

  .flavor-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 12px;
    background: var(--bg-2); margin-bottom: 6px;
    gap: 8px; transition: all 0.2s;
  }
  .flavor-row:hover { background: var(--card-hover); }
  .flavor-name { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flavor-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .btn {
    padding: 10px 16px; border: none; border-radius: 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.25s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,212,255,0.3);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.4); }
  .btn-success { background: var(--success); color: #052e1f; }
  .btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6,255,165,0.4); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 10px; }
  .btn-block { width: 100%; padding: 14px; font-size: 14px; }
  .btn-cart {
    background: var(--success); color: #052e1f;
    padding: 8px 14px; border-radius: 10px;
    font-size: 12px; font-weight: 700;
    border: none; cursor: pointer; transition: all 0.25s;
    white-space: nowrap;
  }
  .btn-cart:hover:not(:disabled) { transform: scale(1.05); }
  .btn-cart:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-cart.in-cart { background: var(--accent); color: #fff; }

  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; background: var(--bg-2);
    border-radius: 12px; margin-bottom: 8px; gap: 8px;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .cart-item-price { font-size: 14px; font-weight: 700; color: var(--accent); }
  .cart-total {
    display: flex; justify-content: space-between;
    font-size: 18px; font-weight: 800;
    padding: 16px; background: var(--bg-2);
    border-radius: 14px; margin-top: 12px;
    border: 1px solid var(--border);
  }
  .cart-total span:last-child {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .promo-welcomed {
    background: linear-gradient(135deg, rgba(255,176,32,0.15), rgba(255,77,109,0.1));
    border: 1px solid var(--warning);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .promo-welcomed .icon { font-size: 28px; flex-shrink: 0; }
  .promo-welcomed .info { flex: 1; }
  .promo-welcomed .title { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: var(--warning); }
  .promo-welcomed .text { font-size: 12px; color: var(--text-dim); }
  .promo-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin: 12px 0;
    cursor: pointer; transition: all 0.25s;
  }
  .promo-toggle:hover { border-color: var(--warning); }
  .promo-toggle.active { border-color: var(--warning); background: rgba(255,176,32,0.08); }
  .promo-toggle .left { display: flex; align-items: center; gap: 10px; }
  .promo-toggle .left .icon { font-size: 20px; }
  .promo-toggle .left .label { font-size: 14px; font-weight: 600; }
  .promo-toggle .left .sub { font-size: 12px; color: var(--text-dim); }
  .toggle-switch {
    width: 46px; height: 26px; border-radius: 30px;
    background: #334155; position: relative;
    transition: background 0.3s; flex-shrink: 0;
  }
  .toggle-switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .toggle-switch.on { background: linear-gradient(135deg, var(--warning), #ff8c00); }
  .toggle-switch.on::after { transform: translateX(20px); }

  .profile-header {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 24px; padding: 24px; color: #fff;
    position: relative; overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 16px 48px rgba(0,212,255,0.3);
    animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .profile-header::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
    border-radius: 50%;
  }
  .profile-user { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .profile-avatar {
    width: 64px; height: 64px; border-radius: 20px;
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
    border: 2px solid rgba(255,255,255,0.3);
    overflow: hidden; flex-shrink: 0;
  }
  .profile-avatar img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .profile-info h2 { font-size: 19px; font-weight: 700; }
  .profile-id {
    font-size: 11px; opacity: 0.85; margin-top: 4px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.2); padding: 2px 8px;
    border-radius: 6px; display: inline-block;
    cursor: pointer;
  }
  .profile-role {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; margin-top: 8px;
    letter-spacing: 0.5px;
  }
  .profile-role.admin { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #333; border-color: #ffd700; }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin: 16px 0; position: relative; z-index: 1;
  }
  .stat-card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    border-radius: 14px; padding: 12px 8px; text-align: center;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .stat-val { font-size: 17px; font-weight: 800; }
  .stat-label { font-size: 10px; opacity: 0.85; margin-top: 2px; }

  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px;
    cursor: pointer; transition: all 0.25s;
    color: var(--text); width: 100%; text-align: left;
    font-family: inherit; font-size: 14px;
  }
  .menu-item:hover {
    border-color: var(--accent);
    transform: translateX(4px);
    box-shadow: 0 4px 16px rgba(0,212,255,0.15);
  }
  .menu-item:active { transform: scale(0.98) translateX(2px); }
  .menu-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(124,58,237,0.12));
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0;
  }
  .menu-text { flex: 1; }
  .menu-text .title { font-size: 14px; font-weight: 600; }
  .menu-text .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .menu-badge {
    background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px;
    min-width: 22px; text-align: center;
  }
  .menu-arrow { color: var(--text-dim); font-size: 16px; flex-shrink: 0; }
  .menu-item.admin-only { border-color: rgba(255,215,0,0.3); }
  .menu-item.admin-only .menu-icon { color: #ffd700; background: rgba(255,215,0,0.1); }

  .overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(5,8,15,0.8); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.35s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 24px 20px;
    max-width: 460px; width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .overlay.open .modal { transform: scale(1) translateY(0); }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 17px; font-weight: 700; }
  .modal-close {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .modal-close:hover { background: var(--danger); color: #fff; border-color: var(--danger); transform: rotate(90deg); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 14px;
    font-family: inherit; outline: none;
    transition: border 0.25s, box-shadow 0.25s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,212,255,0.12);
  }
  .field textarea { resize: vertical; min-height: 60px; }

  .roulette-container {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 24px 16px;
    text-align: center; margin-bottom: 16px;
  }
  .slot-machine {
    width: 240px; height: 140px; margin: 0 auto 24px;
    overflow: hidden; position: relative;
    background: linear-gradient(180deg, #0a0e17 0%, #0f1420 50%, #0a0e17 100%);
    border-radius: 20px;
    border: 3px solid var(--accent);
    box-shadow: 0 0 40px rgba(0,212,255,0.3), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .slot-machine::before, .slot-machine::after {
    content: ''; position: absolute; left: 0; right: 0; height: 40px;
    pointer-events: none; z-index: 2;
  }
  .slot-machine::before {
    top: 0;
    background: linear-gradient(180deg, rgba(10,14,23,0.95), transparent);
  }
  .slot-machine::after {
    bottom: 0;
    background: linear-gradient(0deg, rgba(10,14,23,0.95), transparent);
  }
  .slot-reel {
    position: absolute; width: 100%; top: 0; left: 0;
    will-change: transform;
  }
  .slot-item {
    height: 140px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 800;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255,215,0,0.6);
    letter-spacing: 2px;
    transition: opacity 0.3s, transform 0.3s;
  }
  .slot-item.win { color: var(--success); text-shadow: 0 0 40px rgba(6,255,165,0.8); }
  .slot-item.lose { color: #ff6b6b; text-shadow: 0 0 30px rgba(255,107,107,0.5); }
  .spin-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 40px;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    color: #333; border: none; border-radius: 30px;
    font-size: 17px; font-weight: 800;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(255,107,107,0.4);
  }

/* =========================================================

const BOT_TOKEN = '8753888540:AAG67A5-W6_3J99mM-Om_P2HdiDKO_S3htY';

const ADMIN_TELEGRAM_ID = 5993502384;
const BASE_USERS_COUNT = 79;

firebase.initializeApp({
  apiKey: "AIzaSyDEMDoBe8qtBcKUzmPlOLStCwn21_x5SBQ",
  authDomain: "swwshop.firebaseapp.com",
  databaseURL: "https://swwshop-default-rtdb.firebaseio.com",
  projectId: "swwshop",
  storageBucket: "swwshop.firebasestorage.app",
  messagingSenderId: "698268675105",
  appId: "1:698268675105:web:15814d169ee2e74c8e4760"
});
const db = firebase.database();

let user = null;
let isAdmin = false;
let data = { liquids: [], pouches: [], coils: [], devices: [] };
let orders = [];

let users = {};

let appliedDiscount = null;
let useDiscountInOrder = true;

let lastSpin = parseInt(localStorage.getItem('sww_last_spin') || '0');
let spinning = false;
let initialized = false;

/* =========================================================
   ID ПОЛЬЗОВАТЕЛЯ
   ========================================================= */
function getUserId() {
  const tgU = window.Telegram?.WebApp?.initDataUnsafe?.user;
  if (tgU) return 'tg_' + tgU.id;
  let id = localStorage.getItem('sww_uid');
  if (!id) { id = 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); localStorage.setItem('sww_uid', id); }
  return id;
}

// Fallback: детерминированный хеш (используется если счётчик недоступен)
function generateShortId(uid) {
  if (uid === 'tg_' + ADMIN_TELEGRAM_ID) return 'SWWSHOP-OWNER';
  let hash = 0;
  for (let i = 0; i < uid.length; i++) {
    hash = ((hash << 5) - hash) + uid.charCodeAt(i);
    hash = hash & hash;
  }
  const base = Math.abs(hash).toString(36).toUpperCase();
  const padded = (base + '00000000').slice(0, 8);
  return 'SWW-' + padded.slice(0, 4) + '-' + padded.slice(4, 8);
}

// Уникальный ID через счётчик Firebase
async function getUniqueShortId() {
  const counterRef = db.ref('meta/shortIdCounter');
  const result = await counterRef.transaction(current => {
    return (current || 0) + 1;
  });
  if (!result.committed) throw new Error('Не удалось получить ID');
  const num = result.snapshot.val();
  const base = num.toString(36).toUpperCase().padStart(8, '0');
  return 'SWW-' + base.slice(0, 4) + '-' + base.slice(4, 8);
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
async function initUser() {
  const uid = getUserId();
  const tgU = window.Telegram?.WebApp?.initDataUnsafe?.user;

  const adminLoggedOut = localStorage.getItem('sww_admin_logged_out') === 'true';
  const isOwnerByTg = tgU && tgU.id === ADMIN_TELEGRAM_ID;
  const isOwnerByWeb = localStorage.getItem('sww_admin') === 'true';

  isAdmin = !adminLoggedOut && (isOwnerByTg || isOwnerByWeb);

  if (tgU) {
    user = {
      id: uid,
      telegramId: tgU.id,
      firstName: tgU.first_name || 'Пользователь',
      lastName: tgU.last_name || '',
      username: tgU.username || '',
      photoUrl: tgU.photo_url || '',
      isAdmin: isAdmin
    };
    try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (_) {}
  } else {
    user = {
      id: uid,
      telegramId: null,
      firstName: 'Гость',
      lastName: '',
      username: '',
      photoUrl: '',
      isAdmin: isAdmin
    };
  }

  // Проверяем запись в Firebase
  const snap = await db.ref('users/' + uid).once('value');
  const u = snap.val();

  // Определяем shortId
  if (uid === 'tg_' + ADMIN_TELEGRAM_ID) {
    user.shortId = 'SWWSHOP-OWNER';
  } else if (u?.shortId && u.shortId.startsWith('SWW-')) {
    // Уже есть уникальный ID — используем
    user.shortId = u.shortId;
  } else {
    // Генерируем новый уникальный
    try {
      user.shortId = await getUniqueShortId();
    } catch (e) {
      console.warn('Counter недоступен, fallback на hash');
      user.shortId = generateShortId(uid);
    }
  }

  if (u) {
    user.savedDiscount = u.savedDiscount || null;
    user.email = u.email || null;
    user.firstSeen = u.firstSeen;
    if (!user.photoUrl && u.photoUrl) user.photoUrl = u.photoUrl;
  }

  await db.ref('users/' + uid).update({
    id: uid,
    shortId: user.shortId,
    firstName: user.firstName,
    lastName: user.lastName,
    username: user.username,
    telegramId: user.telegramId,
    photoUrl: user.photoUrl || null,
    isAdmin: isAdmin,
    lastSeen: Date.now(),
    firstSeen: u?.firstSeen || Date.now()
  });

  applySavedPromo();
  loadUserOrders();

  if (isAdmin) {
    setTimeout(() => toast('👑 Вы вошли как администратор', '👑'), 800);
  }
}

async function applySavedPromo() {
  const uid = getUserId();
  const allPromos = promos || {};
  const myPromos = Object.entries(allPromos).filter(([code, p]) => {
    if (p.used) return false;
    if (p.userId === uid) return true;
    if (!p.userId && !p.usedBy) return true;
    return false;
  });

  if (myPromos.length > 0) {
    const best = myPromos.reduce((a, b) => (a[1].discount > b[1].discount ? a : b));
    appliedDiscount = { code: best[0], discount: best[1].discount };
    db.ref('users/' + uid + '/savedDiscount').set(appliedDiscount);
  } else {
    appliedDiscount = user?.savedDiscount || null;
  }
}

function loadUserOrders() {
  const uid = getUserId();
  db.ref('orders').orderByChild('userId').equalTo(uid).on('value', s => {
    const val = s.val();
    userOrders = val ? Object.values(val) : [];
    if (currentPage === 'profile') renderProfile();
  });

  if (isAdmin) {
    db.ref('orders').on('value', s => {
      const val = s.val();
      orders = val ? Object.values(val) : [];
    });
  }
}

function getUserStats() {
  const totalOrders = userOrders.length;
  const totalSum = userOrders.reduce((sum, o) => sum + (o.total || 0), 0);
  const maxOrder = userOrders.reduce((max, o) => Math.max(max, o.total || 0), 0);
  return { totalOrders, totalSum, maxOrder };
}

function loadAssortment() {
  db.ref('assortment').on('value', s => {
    const v = s.val();
    data = v || { liquids: [], pouches: [], coils: [], devices: [] };
    if (!data.liquids) data.liquids = [];
    if (!data.pouches) data.pouches = [];
    if (!data.coils) data.coils = [];
    if (!data.devices) data.devices = [];

    if (!initialized) {
      initialized = true;
      render();
    } else if (currentPage === 'catalog') {
      renderCatalog();
    }
  });
}

function loadPromos() {
  db.ref('promos').on('value', s => {
    promos = s.val() || {};
    applySavedPromo();
  });
}

function loadUsers() {
  db.ref('users').on('value', s => {
    users = s.val() || {};
  });
}

/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  if (!user) {
    document.getElementById('app').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><h3>Загрузка...</h3></div>';
    return;
  }
  if (currentPage === 'catalog') renderCatalog();
  else if (currentPage === 'order') renderOrder();
  else if (currentPage === 'roulette') renderRoulette();
  else if (currentPage === 'profile') renderProfile();
  updateCartBadge();
}

   КАТАЛОГ
   ========================================================= */
function renderCatalog() {
  const categories = [
    { id: 'liquids', name: 'Жидкости', desc: 'Для pod-систем и вейпов', icon: 'drop' },
    { id: 'pouches', name: 'Шайбы', desc: 'Никотиновые паучи', icon: 'cube' },

    { id: 'devices', name: 'Устройства', desc: 'Под-системы и боксы', icon: 'device' }
  ];

  document.getElementById('app').innerHTML = `
    <section class="hero">
      <div class="hero-badge"><span class="dot"></span> Каталог</div>
      <h1>Добро пожаловать в<br><span class="grad">SWWSHOP</span></h1>
      <p>Премиальные жидкости, шайбы и устройства.</p>

function openCategory(catId) {
  currentCategory = catId;
  const titles = { liquids: 'Жидкости', pouches: 'Шайбы', coils: 'Испарители', devices: 'Устройства' };

  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="navigate('catalog')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <div id="productsList">${renderProducts(catId)}</div>

function renderProducts(catId) {
  const items = data[catId] || [];
  if (!items.length) {
    return '<div class="empty-state"><div class="icon">📦</div><h3>Товаров пока нет</h3><p>Заходите позже</p></div>';
  }

  if (catId === 'liquids' || catId === 'pouches') {
    return items.map((line, i) => {
      const totalQty = line.flavors.reduce((s, f) => s + (f.quantity || 0), 0);
      return `
        <div class="cat-card" onclick="openLine('${catId}', ${i})">
          <div class="cat-left">
            <div class="cat-info">
              <div class="cat-name">${line.name}</div>
              <div class="cat-desc">${line.flavors.length} вкусов${isAdmin ? ` · ${totalQty} шт` : ''}</div>
            </div>
          </div>
          <div class="cat-right">
            <span class="cat-count">${line.price} ₽</span>
            <svg class="cat-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      `;
    }).join('');
  } else {
    return items.map((item, i) => {
      const qty = item.quantity || 0;
      const inCart = cart.some(c => c.id === item.id);
      const canAdd = qty > 0 && !inCart;
      let statusClass = 'status-in-stock', statusText = 'В наличии';
      if (inCart) { statusClass = 'status-in-cart'; statusText = 'В корзине'; }
      else if (qty === 0) { statusClass = 'status-out-stock'; statusText = 'Нет в наличии'; }

      return `
        <div class="product-card">
          <div class="product-head">
            <div class="product-name">${item.name}</div>
            <div class="product-price">${item.price} ₽</div>
          </div>
          <div class="product-meta">
            <span class="status-badge ${statusClass}">${statusText}</span>
            <button class="btn-cart ${inCart ? 'in-cart' : ''}" ${canAdd ? '' : 'disabled'} onclick="${canAdd ? `addToCartSimple('${catId}', ${i})` : ''}">
              ${inCart ? '✓ В корзине' : (qty > 0 ? '🛒 В корзину' : 'Нет')}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }
}

function filterProducts(query) {
  const items = data[currentCategory] || [];
  const q = query.toLowerCase().trim();
  const container = document.getElementById('productsList');
  if (!q) { container.innerHTML = renderProducts(currentCategory); return; }
  const filtered = items.filter(item => item.name.toLowerCase().includes(q));
  if (!filtered.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Ничего не найдено</h3></div>';
    return;
  }
  const original = data[currentCategory];
  data[currentCategory] = filtered;
  container.innerHTML = renderProducts(currentCategory);
  data[currentCategory] = original;
}

function openLine(catId, index) {
  currentCategory = catId;
  const line = data[catId][index];
  if (!line) { navigate('catalog'); return; }

  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="openCategory('${catId}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Назад
    </button>
    <h1 style="font-size:22px;font-weight:800;margin-bottom:6px;">${line.name}</h1>
    <p style="color:var(--accent);font-weight:700;font-size:18px;margin-bottom:20px;">${line.price} ₽</p>
    <div class="section-title">Выберите вкус (${line.flavors.length})</div>
    ${line.flavors.map((f, fi) => {
      const qty = f.quantity || 0;
      const inCart = cart.some(c => c.id === f.id);
      const canAdd = qty > 0 && !inCart;
      let statusClass = 'status-in-stock', statusText = 'В наличии';
      if (inCart) { statusClass = 'status-in-cart'; statusText = '✓ В корзине'; }
      else if (qty === 0) { statusClass = 'status-out-stock'; statusText = 'Нет'; }

      return `
        <div class="flavor-row">
          <span class="flavor-name">${f.name}</span>
          <div class="flavor-actions">
            <span class="status-badge ${statusClass}">${statusText}</span>
            <button class="btn-cart ${inCart ? 'in-cart' : ''}" ${canAdd ? '' : 'disabled'} onclick="${canAdd ? `addToCartFlavor('${catId}', ${index}, ${fi})` : ''}">
              ${inCart ? '✓' : (qty > 0 ? '🛒' : '—')}
            </button>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

/* =========================================================
   КОРЗИНА
   ========================================================= */
function addToCartSimple(catId, index) {
  const item = data[catId][index];
  if (!item || (item.quantity || 0) <= 0) { toast('❌ Нет в наличии', '❌'); return; }
  if (cart.some(c => c.id === item.id)) { toast('❌ Уже в корзине', '❌'); return; }

  cart.push({
    id: item.id,
    name: item.name,
    price: item.price,
    qty: 1,
    category: catId,
    index: index,
    type: 'simple'
  });
  saveCart();
  toast('✅ Добавлено в корзину', '🛒');
  renderProductsInPlace();
}

function addToCartFlavor(catId, lineIndex, flavorIndex) {
  const line = data[catId][lineIndex];
  const flavor = line.flavors[flavorIndex];
  if (!flavor || (flavor.quantity || 0) <= 0) { toast('❌ Нет в наличии', '❌'); return; }
  if (cart.some(c => c.id === flavor.id)) { toast('❌ Уже в корзине', '❌'); return; }

  cart.push({
    id: flavor.id,
    name: flavor.name + ' (' + line.name + ')',
    price: line.price,
    qty: 1,
    category: catId,
    lineIndex: lineIndex,
    flavorIndex: flavorIndex,
    type: 'flavor'
  });
  saveCart();
  toast('✅ Добавлено в корзину', '🛒');
  openLine(catId, lineIndex);
}

function renderProductsInPlace() {
  if (document.getElementById('productsList')) {
    document.getElementById('productsList').innerHTML = renderProducts(currentCategory);
  }
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart();
  if (currentPage === 'order') renderOrder();
  toast('🗑️ Удалено', '🗑️');
}

function saveCart() {
  localStorage.setItem('sww_cart', JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.style.display = cart.length > 0 ? 'block' : 'none';
    badge.textContent = cart.length;
  }
}

function openCart() {
  renderCart();
  openOverlay('cartOverlay');
}

function renderCart() {
  const el = document.getElementById('cartContent');
  if (!cart.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🛒</div><h3>Корзина пуста</h3><p>Добавьте товары из каталога</p></div>';
    return;
  }

  const subtotal = cart.reduce((s, c) => s + c.price * (c.qty || 1), 0);

  el.innerHTML = `
    ${cart.map(c => `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-price">${c.price} ₽</div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="removeFromCart('${c.id}')">✕</button>
      </div>
    `).join('')}
    <div class="cart-total">
      <span>Итого:</span>
      <span>${subtotal} ₽</span>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="closeOverlay('cartOverlay');navigate('order')">

function toggleDiscount() {
  useDiscountInOrder = !useDiscountInOrder;

}

async function submitOrder() {
  if (!cart.length) { toast('❌ Корзина пуста', '❌'); return; }

  const name = document.getElementById('orderName').value.trim();
  const contact = document.getElementById('orderContact').value.trim();
  const payment = document.getElementById('orderPayment').value;
  const comment = document.getElementById('orderComment').value.trim();

  if (!name || !contact || !payment) {
    toast('❌ Заполните все обязательные поля', '❌');
    return;
  }

  const subtotal = cart.reduce((s, c) => s + c.price * (c.qty || 1), 0);
  let discount = 0;
  if (useDiscountInOrder && appliedDiscount) {
    discount = Math.round(subtotal * appliedDiscount.discount / 100);
  }
  const total = subtotal - discount;

  const orderId = 'SWW-' + Date.now().toString(36).toUpperCase().slice(-6);

  const orderData = {
    id: orderId,
    userId: user.id,
    userShortId: user.shortId,
    userName: name,
    userContact: contact,
    username: user.username,
    telegramId: user.telegramId,
    items: [...cart],
    subtotal: subtotal,
    discount: discount,
    discountCode: useDiscountInOrder ? appliedDiscount?.code : null,
    total: total,
    payment: payment,
    comment: comment,
    status: 'pending',
    date: Date.now()
  };

  try {
    await db.ref('orders/' + orderId).set(orderData);

    for (const item of cart) {
      if (item.type === 'flavor') {
        const line = data[item.category]?.[item.lineIndex];
        if (line) {
          const currentQty = line.flavors[item.flavorIndex]?.quantity || 0;
          await db.ref(`assortment/${item.category}/${item.lineIndex}/flavors/${item.flavorIndex}/quantity`)
            .set(Math.max(0, currentQty - 1));
        }
      } else {
        const currentQty = data[item.category]?.[item.index]?.quantity || 0;
        await db.ref(`assortment/${item.category}/${item.index}/quantity`)
          .set(Math.max(0, currentQty - 1));
      }
    }

    if (useDiscountInOrder && appliedDiscount?.code && promos[appliedDiscount.code]) {
      await db.ref('promos/' + appliedDiscount.code).update({
        used: true,
        usedBy: user.id,
        usedAt: Date.now(),
        orderId: orderId
      });
    }

    let adminMsg = `🛒 НОВЫЙ ЗАКАЗ #${orderId}\n\n`;
    adminMsg += `👤 ${name}\n`;
    adminMsg += `📱 ${contact}\n`;
    adminMsg += `💳 ${payment}\n`;
    adminMsg += `🆔 ID клиента: ${user.shortId}\n\n`;
    adminMsg += `📋 Товары:\n`;
    cart.forEach((item, i) => {
      adminMsg += `${i + 1}. ${item.name} - ${item.price}₽\n`;
    });
    if (discount > 0) {
      adminMsg += `\n💎 Скидка ${appliedDiscount.discount}% (-${discount}₽) [${appliedDiscount.code}]`;
    }
    adminMsg += `\n💰 Итого: ${total}₽`;
    if (comment) adminMsg += `\n\n💬 ${comment}`;

    if (BOT_TOKEN && !BOT_TOKEN.startsWith('__')) {
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: adminMsg })
      }).catch(() => {});
    }

    if (user.telegramId && BOT_TOKEN && !BOT_TOKEN.startsWith('__')) {
      let userMsg = `✅ Заказ #${orderId} принят!\n\n`;
      userMsg += `📋 Товары:\n`;
      cart.forEach((item, i) => {
        userMsg += `${i + 1}. ${item.name} - ${item.price}₽\n`;
      });
      if (discount > 0) userMsg += `\n💎 Скидка: -${discount}₽`;
      userMsg += `\n💰 Итого: ${total}₽`;
      userMsg += `\n\n⏳ Статус: Ожидает подтверждения`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: user.telegramId, text: userMsg })
      }).catch(() => {});
    }

    cart = [];
    saveCart();
    toast('✅ Заказ оформлен!', '🎉');
    setTimeout(() => navigate('profile'), 600);

  } catch (e) {
    console.error(e);
    toast('❌ Ошибка оформления', '❌');
  }
}

    { d: 0, label: '0%', cls: 'lose' },

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>

        ${canSpin ? 'КРУТИТЬ' : 'ЖДИТЕ'}
      </button>

      <div class="roulette-legend">

        <div class="item"><span class="dot" style="background:#00d4ff;"></span> 1% — часто</div>
        <div class="item"><span class="dot" style="background:#06ffa5;"></span> 5% — редко</div>
        <div class="item"><span class="dot" style="background:#ffd700;"></span> 15% — джекпот</div>
      </div>

    ${user.isAdmin ? `
      <div class="promo-welcomed" style="margin-top:16px;">
        <span class="icon">👑</span>
        <div class="info">
          <div class="title">Режим администратора</div>
          <div class="text">Вы можете крутить рулетку без ограничений</div>
        </div>
      </div>
    ` : ''}

function updateSpinTimer() {
  const timerEl = document.getElementById('rouletteTimer');
  if (!timerEl) return;
  if (user.isAdmin) {
    timerEl.innerHTML = '<span style="color:#06ffa5;">✅ Безлимитные вращения</span>';
    return;
  }
  const now = Date.now();
  const week = 7 * 24 * 60 * 60 * 1000;
  const left = week - (now - lastSpin);
  if (left <= 0) {
    timerEl.innerHTML = '<span style="color:#06ffa5;">✅ Можно крутить!</span>';
    const btn = document.getElementById('spinBtn');
    if (btn) { btn.disabled = false; btn.innerHTML = '🎰 КРУТИТЬ'; }
  } else {
    const d = Math.floor(left / 86400000);
    const h = Math.floor((left % 86400000) / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    timerEl.innerHTML = `⏳ Следующее вращение через: <span style="color:#ffb020;font-weight:700;">${d}д ${h}ч ${m}м</span>`;
  }
}

function spinRoulette() {
  if (spinning) return;
  if (!user.isAdmin && Date.now() - lastSpin < 7 * 24 * 60 * 60 * 1000) {
    updateSpinTimer();
    return;
  }
  spinning = true;

  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.innerHTML = '🎰 Крутится...';

  const rand = Math.random();
  let prize = { discount: 0, label: '0%' };
  if (rand < 0.01) prize = { discount: 15, label: '15%' };
  else if (rand < 0.08) prize = { discount: 5, label: '5%' };
  else if (rand < 0.25) prize = { discount: 1, label: '1%' };

  let targetIndex;
  if (prize.discount === 15) targetIndex = 8;
  else if (prize.discount === 5) targetIndex = [4, 12][Math.floor(Math.random() * 2)];
  else if (prize.discount === 1) targetIndex = [2, 6, 10][Math.floor(Math.random() * 3)];
  else targetIndex = [0, 1, 3, 5, 7, 9, 11, 13, 14][Math.floor(Math.random() * 9)];

  const itemHeight = 140;
  const totalItems = 15;
  const rounds = user.isAdmin ? 6 : 5;
  const finalY = (rounds * totalItems + targetIndex) * itemHeight;

  const reel = document.getElementById('slotReel');
  const duration = user.isAdmin ? 5500 : 4500;
  const easing = 'cubic-bezier(0.15, 0.85, 0.25, 1)';

  reel.style.transition = 'none';
  reel.style.transform = 'translate3d(0, 0, 0)';
  reel.style.willChange = 'transform';

  void reel.offsetHeight;

  setTimeout(() => {
    reel.style.transition = `transform ${duration}ms ${easing}`;
    reel.style.transform = `translate3d(0, -${finalY}px, 0)`;
  }, 50);

  if (!user.isAdmin) {
    lastSpin = Date.now();
    localStorage.setItem('sww_last_spin', lastSpin.toString());
  }

  setTimeout(() => {
    const allItems = reel.querySelectorAll('.slot-item');
    allItems.forEach(it => { it.style.opacity = '0.4'; it.style.transform = 'scale(1)'; });

    const visibleIndex = Math.floor(finalY / itemHeight) % totalItems;
    if (allItems[visibleIndex]) {
      allItems[visibleIndex].style.opacity = '1';
      allItems[visibleIndex].style.transform = 'scale(1.2)';
    }

    spinning = false;
    btn.disabled = false;
    updateSpinTimer();

    if (prize.discount > 0) {
      const code = 'SPIN-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      const promoData = {
        discount: prize.discount,
        used: false,
        created: Date.now(),
        type: 'roulette',
        userId: user.id,
        userName: user.firstName,
        uses: 0,
        maxUses: 1
      };
      db.ref('promos/' + code).set(promoData);

      document.getElementById('rouletteResult').innerHTML = `
        <div style="color:var(--success);">🎉 Поздравляем!</div>
        <span class="prize">+${prize.discount}% скидка</span>
        <div style="font-size:13px;color:var(--text-dim);">
          Код <b style="color:var(--accent);">${code}</b> сохранён в вашем профиле
        </div>
      `;

      setTimeout(() => applySavedPromo(), 100);

      if (BOT_TOKEN && !BOT_TOKEN.startsWith('__')) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `🎰 ${user.firstName} (${user.shortId}) выиграл скидку ${prize.discount}% (${code})`
          })
        }).catch(() => {});
      }

    } else {
      document.getElementById('rouletteResult').innerHTML = `
        <div style="color:#ff6b6b;font-size:15px;">😔 Не повезло</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:6px;">
          В следующий раз обязательно повезёт!
        </div>
      `;
    }
  }, duration + 100);
}

function tryLoginAsAdmin() {
  const tgU = window.Telegram?.WebApp?.initDataUnsafe?.user;
  const isOwner = (tgU && tgU.id === ADMIN_TELEGRAM_ID);

  if (!isOwner) {
    toast('❌ Доступ только для владельца', '❌');
    return;
  }

  if (!confirm('Войти в режим администратора?')) return;

  localStorage.removeItem('sww_admin_logged_out');
  localStorage.setItem('sww_admin', 'true');
  toast('👑 Вход в админ-панель...', '👑');
  setTimeout(() => location.reload(), 500);
}

function renderMyOrders() {
  const el = document.getElementById('ordersContent');
  if (!userOrders.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h3>Заказов пока нет</h3><p>Оформите первый заказ в каталоге</p></div>';
    return;
  }
  const sorted = [...userOrders].sort((a, b) => (b.date || 0) - (a.date || 0));
  el.innerHTML = sorted.map(o => {
    const statusMap = {
      pending: { cls: 'status-pending', txt: '⏳ В обработке' },
      completed: { cls: 'status-completed', txt: '✅ Выполнен' },
      cancelled: { cls: 'status-cancelled', txt: '❌ Отменён' }
    };
    const st = statusMap[o.status] || statusMap.pending;
    return `
      <div class="order-card">
        <div class="order-head">
          <div>
            <div class="order-id">#${o.id}</div>
            <div class="order-date">${new Date(o.date).toLocaleString('ru-RU')}</div>
          </div>
          <span class="order-status ${st.cls}">${st.txt}</span>
        </div>
        <div class="order-items">
          ${(o.items || []).map(it => `• ${it.name} — ${it.price}₽`).join('<br>')}

        <div class="order-total">${o.total} ₽</div>
      </div>
    `;
  }).join('');
}

      <input type="text" id="newShortId" placeholder="SWW-XXXX-XXXX" />
    </div>

    <button class="admin-action-btn btn-cyan" onclick="toggleWinter()">❄️ Переключить зимнюю тему</button>

    <div class="section-title" style="margin-top:20px;color:var(--warning);">🔧 Служебное</div>
    <button class="admin-action-btn btn-orange" onclick="adminMigrateShortIds()">🔄 Пересчитать все Short ID</button>

    <div class="section-title" style="margin-top:20px;color:var(--danger);">Опасная зона</div>
    <button class="admin-action-btn btn-red" onclick="adminLogout()">🚪 Выйти из админ-панели</button>
  `;

  updateDelSelect();
  updatePriceSelectAdmin();
  updateQtySelectAdmin();
  renderAllPromosAdmin();
}

function renderAllOrders() {
  const el = document.getElementById('allOrdersContent');
  if (!orders.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h3>Заказов пока нет</h3></div>';
    return;
  }
  const sorted = [...orders].sort((a, b) => (b.date || 0) - (a.date || 0));
  el.innerHTML = sorted.map(o => {
    const statusMap = {
      pending: { cls: 'status-pending', txt: '⏳ Ожидает' },
      completed: { cls: 'status-completed', txt: '✅ Выполнен' },
      cancelled: { cls: 'status-cancelled', txt: '❌ Отменён' }
    };
    const st = statusMap[o.status] || statusMap.pending;
    return `
      <div class="order-card">
        <div class="order-head">
          <div>
            <div class="order-id">#${o.id}</div>
            <div class="order-date">${new Date(o.date).toLocaleString('ru-RU')}</div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">
              👤 ${o.userName} · ${o.userShortId || ''}
            </div>
            <div style="font-size:12px;color:var(--text-dim);">📱 ${o.userContact}</div>
            <div style="font-size:12px;color:var(--text-dim);">💳 ${o.payment}</div>
          </div>
          <span class="order-status ${st.cls}">${st.txt}</span>
        </div>
        <div class="order-items">
          ${(o.items || []).map(it => `• ${it.name} — ${it.price}₽`).join('<br>')}
        </div>
        ${o.discount > 0 ? `<div style="font-size:11px;color:var(--warning);">💎 -${o.discount}₽</div>` : ''}
        <div class="order-total">${o.total} ₽</div>
        ${o.status === 'pending' ? `
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-success btn-sm" style="flex:1;" onclick="adminCompleteOrder('${o.id}')">✅ Выполнить</button>
            <button class="btn btn-danger btn-sm" style="flex:1;" onclick="adminCancelOrder('${o.id}')">❌ Отменить</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

async function adminCompleteOrder(orderId) {
  if (!user.isAdmin) return;
  if (!confirm('Подтвердить заказ #' + orderId + '?')) return;
  await db.ref('orders/' + orderId).update({ status: 'completed', completedAt: Date.now() });
  toast('✅ Заказ выполнен', '✅');
  renderAllOrders();
}

async function adminCancelOrder(orderId) {
  if (!user.isAdmin) return;
  if (!confirm('Отменить заказ #' + orderId + '? Товары вернутся в наличие.')) return;

  const snap = await db.ref('orders/' + orderId).once('value');
  const order = snap.val();
  if (!order) return;

  for (const item of (order.items || [])) {
    if (item.type === 'flavor') {
      const currentSnap = await db.ref(`assortment/${item.category}/${item.lineIndex}/flavors/${item.flavorIndex}/quantity`).once('value');
      const q = currentSnap.val() || 0;
      await db.ref(`assortment/${item.category}/${item.lineIndex}/flavors/${item.flavorIndex}/quantity`).set(q + 1);
    } else {
      const currentSnap = await db.ref(`assortment/${item.category}/${item.index}/quantity`).once('value');
      const q = currentSnap.val() || 0;
      await db.ref(`assortment/${item.category}/${item.index}/quantity`).set(q + 1);
    }
  }

  await db.ref('orders/' + orderId).update({ status: 'cancelled', cancelledAt: Date.now() });
  toast('❌ Заказ отменён', '❌');
  renderAllOrders();
}

async function adminAddProduct() {
  if (!user.isAdmin) return;
  const name = document.getElementById('addName').value.trim();
  const price = parseInt(document.getElementById('addPrice').value);
  const category = document.getElementById('addCategory').value;
  const qty = parseInt(document.getElementById('addQty').value) || 1;
  const flavorsText = document.getElementById('addFlavors').value.trim();

  if (!name || !price) { toast('❌ Заполните название и цену', '❌'); return; }

  if (category === 'liquids' || category === 'pouches') {
    if (!flavorsText) { toast('❌ Добавьте хотя бы один вкус', '❌'); return; }
    const flavors = flavorsText.split('\n').filter(l => l.trim()).map(l => {
      const parts = l.split(',');
      return {
        id: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        name: parts[0].trim(),
        inStock: (parts[1] || '').trim().toUpperCase() === 'YES',
        quantity: qty
      };
    });
    if (!data[category]) data[category] = [];
    data[category].push({ name, price, flavors });
  } else {
    if (!data[category]) data[category] = [];
    data[category].push({
      id: 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      name, price,
      quantity: qty,
      inStock: qty > 0
    });
  }

  await db.ref('assortment').set(data);
  toast('✅ Товар добавлен', '✅');

  document.getElementById('addName').value = '';
  document.getElementById('addPrice').value = '';
  document.getElementById('addFlavors').value = '';
}

async function adminCreatePromo() {
  if (!user.isAdmin) return;
  const userId = document.getElementById('promoUserId').value.trim() || null;
  const discount = parseInt(document.getElementById('promoDiscount').value) || 10;
  const code = 'ADMIN-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  await db.ref('promos/' + code).set({
    discount, used: false, created: Date.now(),
    type: 'admin', userId, uses: 0, maxUses: 1
  });
  toast('✅ Скидка создана: ' + code, '🎫');
  document.getElementById('promoUserId').value = '';
}

function adminSendToUser() {
  const uid = document.getElementById('consoleUser').value;
  const msg = document.getElementById('consoleMsg').value.trim();
  if (!uid || !msg) { toast('❌ Заполните поля', '❌'); return; }

  const u = users[uid];
  if (!u?.telegramId) { toast('❌ У пользователя нет Telegram', '❌'); return; }

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: u.telegramId, text: '📨 Сообщение от админа:\n\n' + msg })
  }).catch(() => {});

  toast('✅ Отправлено', '📨');
  document.getElementById('consoleMsg').value = '';
}

function adminBroadcast() {
  const msg = document.getElementById('broadcastMsg').value.trim();
  if (!msg) return;
  if (!confirm('Отправить всем пользователям?')) return;

  let sent = 0;
  const promises = Object.values(users).filter(u => u.telegramId).map(u => {
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: u.telegramId, text: '📢 SWWSHOP:\n\n' + msg })
    }).then(() => sent++).catch(() => {});
  });

  Promise.all(promises).then(() => toast(`✅ Отправлено ${sent} пользователям`, '📢'));
  document.getElementById('broadcastMsg').value = '';
}

/* =========================================================
   АДМИН: УДАЛЕНИЕ / ИЗМЕНЕНИЕ
   ========================================================= */
function updateDelSelect() {
  const cat = document.getElementById('delCategory')?.value;
  const sel = document.getElementById('delItem');
  if (!sel || !data[cat]) return;
  sel.innerHTML = '<option value="">-- Выберите --</option>';
  data[cat].forEach((item, i) => {
    sel.innerHTML += `<option value="${i}">${item.name} (${item.price}₽)</option>`;
  });
}

function updatePriceSelectAdmin() {
  const cat = document.getElementById('priceCategory')?.value;
  const sel = document.getElementById('priceItem');
  if (!sel || !data[cat]) return;
  sel.innerHTML = '<option value="">-- Выберите --</option>';
  data[cat].forEach((item, i) => {
    sel.innerHTML += `<option value="${i}">${item.name} (${item.price}₽)</option>`;
  });
}

function updateQtySelectAdmin() {
  const cat = document.getElementById('qtyCategory')?.value;
  const sel = document.getElementById('qtyItem');
  if (!sel || !data[cat]) return;
  sel.innerHTML = '<option value="">-- Выберите --</option>';
  data[cat].forEach((item, i) => {
    const qty = cat === 'liquids' || cat === 'pouches'
      ? (item.flavors || []).reduce((s, f) => s + (f.quantity || 0), 0)
      : (item.quantity || 0);
    sel.innerHTML += `<option value="${i}">${item.name} (${qty} шт)</option>`;
  });
}

async function adminDeleteProduct() {
  if (!user.isAdmin) return;
  const cat = document.getElementById('delCategory').value;
  const idx = parseInt(document.getElementById('delItem').value);
  if (isNaN(idx)) { toast('❌ Выберите товар', '❌'); return; }
  if (!confirm(`Удалить "${data[cat][idx].name}"?`)) return;

  data[cat].splice(idx, 1);
  await db.ref('assortment').set(data);
  toast('🗑️ Товар удалён', '🗑️');
  renderAdmin();
}

async function adminUpdatePrice() {
  if (!user.isAdmin) return;
  const cat = document.getElementById('priceCategory').value;
  const idx = parseInt(document.getElementById('priceItem').value);
  const price = parseInt(document.getElementById('newPrice').value);
  if (isNaN(idx) || isNaN(price) || price < 0) { toast('❌ Заполните поля', '❌'); return; }

  data[cat][idx].price = price;
  await db.ref('assortment').set(data);
  toast('💰 Цена обновлена: ' + price + '₽', '💰');
  document.getElementById('newPrice').value = '';
  renderAdmin();
}

async function adminUpdateQty() {
  if (!user.isAdmin) return;
  const cat = document.getElementById('qtyCategory').value;
  const idx = parseInt(document.getElementById('qtyItem').value);
  const qty = parseInt(document.getElementById('newQty').value);
  if (isNaN(idx) || isNaN(qty) || qty < 0) { toast('❌ Заполните поля', '❌'); return; }

  if (cat === 'liquids' || cat === 'pouches') {
    const flavors = data[cat][idx].flavors;
    const perFlavor = Math.floor(qty / flavors.length);
    const remainder = qty % flavors.length;
    flavors.forEach((f, fi) => {
      f.quantity = perFlavor + (fi < remainder ? 1 : 0);
      f.inStock = f.quantity > 0;
    });
  } else {
    data[cat][idx].quantity = qty;
    data[cat][idx].inStock = qty > 0;
  }

  await db.ref('assortment').set(data);
  toast('📦 Количество обновлено', '📦');
  document.getElementById('newQty').value = '';
  renderAdmin();
}

function renderAllPromosAdmin() {
  const el = document.getElementById('allPromosList');
  if (!el) return;
  const list = Object.entries(promos);
  if (!list.length) {
    el.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="icon">🎫</div><h3>Скидок нет</h3></div>';
    return;
  }
  el.innerHTML = list.sort((a, b) => (b[1].created || 0) - (a[1].created || 0)).map(([code, p]) => {
    const owner = p.userId ? (users[p.userId]?.firstName || p.userId) : 'Для всех';
    return `
      <div class="order-card" style="padding:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;color:var(--warning);font-size:14px;">${p.discount}% · ${code}</div>
            <div style="font-size:11px;color:var(--text-dim);">${owner} · ${p.used ? '❌ использована' : '✅ активна'}</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="adminDeletePromo('${code}')">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

async function adminDeletePromo(code) {
  if (!user.isAdmin) return;
  if (!confirm(`Удалить скидку ${code}?`)) return;
  await db.ref('promos/' + code).remove();
  toast('🗑️ Скидка удалена', '🗑️');
  renderAllPromosAdmin();
}

async function adminUpdateShortId() {
  if (!user.isAdmin) return;
  const uid = document.getElementById('userIdEdit').value;
  const newId = document.getElementById('newShortId').value.trim().toUpperCase();
  if (!uid || !newId) { toast('❌ Заполните поля', '❌'); return; }
  if (!/^[A-Z0-9\-]+$/.test(newId)) { toast('❌ Только A-Z, 0-9 и дефис', '❌'); return; }

  await db.ref('users/' + uid + '/shortId').set(newId);
  toast('🆔 ID обновлён: ' + newId, '🆔');
  document.getElementById('newShortId').value = '';

  if (uid === user.id) {
    user.shortId = newId;
    render();
  }
}

async function adminGivePromoByShortId() {
  if (!user.isAdmin) return;
  const shortId = document.getElementById('promoShortId').value.trim().toUpperCase();
  const discount = parseInt(document.getElementById('promoShortDiscount').value) || 10;
  if (!shortId) { toast('❌ Введите Short ID', '❌'); return; }

  const found = Object.values(users).find(u => u.shortId === shortId);
  if (!found) { toast('❌ Пользователь не найден', '❌'); return; }

  const code = 'GIFT-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  await db.ref('promos/' + code).set({
    discount,
    used: false,
    created: Date.now(),
    type: 'gift',
    userId: found.id,
    userName: found.firstName,
    uses: 0,
    maxUses: 1
  });

  toast(`🎁 Скидка ${discount}% выдана ${found.firstName}`, '🎁');

  if (found.telegramId && BOT_TOKEN && !BOT_TOKEN.startsWith('__')) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: found.telegramId,
        text: `🎁 Вам выдана скидка ${discount}%!\n\nОна применится автоматически при следующем заказе.`
      })
    }).catch(() => {});
  }

  document.getElementById('promoShortId').value = '';
}

async function adminMigrateShortIds() {
  if (!user.isAdmin) return;
  if (!confirm('Пересчитать ID всех пользователей? У всех будут новые SWW-XXXX-XXXX.')) return;

  const snap = await db.ref('users').once('value');
  const allUsers = snap.val() || {};
  const entries = Object.entries(allUsers);

  toast(`🔄 Обработка ${entries.length} пользователей...`, '🔄');

  let count = 0;
  for (const [uid, u] of entries) {
    // Пропускаем владельца
    if (uid === 'tg_' + ADMIN_TELEGRAM_ID) {
      await db.ref('users/' + uid + '/shortId').set('SWWSHOP-OWNER');
      continue;
    }
    try {
      // Проверяем, есть ли уже нормальный SWW-ID
      if (u.shortId && /^SWW-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(u.shortId)) {
        // Уже правильный формат — пропускаем
        continue;
      }
      const newId = await getUniqueShortId();
      await db.ref('users/' + uid + '/shortId').set(newId);
      count++;
    } catch (e) {
      console.error('Ошибка для ' + uid, e);
    }
  }

  toast(`✅ Обновлено ${count} пользователей`, '✅');

  // Если мы сами - обновляем локально
  const mySnap = await db.ref('users/' + user.id + '/shortId').once('value');
  const myNewId = mySnap.val();
  if (myNewId) {
    user.shortId = myNewId;
    render();
  }
}

function adminLogout() {
  if (!confirm('Выйти из режима администратора?')) return;
  localStorage.setItem('sww_admin_logged_out', 'true');
  localStorage.removeItem('sww_admin');
  closeOverlay('adminOverlay');
  toast('👋 Вы вышли из админ-панели', '👋');
  setTimeout(() => location.reload(), 500);
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function openOverlay(id) {
  const el = document.getElementById(id);
  if (el) { el.classList.add('open'); document.body.style.overflow = 'hidden'; }
}
function closeOverlay(id) {
  const el = document.getElementById(id);
  if (el) { el.classList.remove('open'); document.body.style.overflow = ''; }
}

document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeOverlay(o.id); });
});

function toast(text, icon = '✅') {
  const t = document.getElementById('toast');
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastText').textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('📋 Скопировано', '📋'));
  }
}

function openSupport() {
  const tg = window.Telegram?.WebApp;
  const url = 'https://t.me/bmqna';
  if (tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}

function toggleTheme() {
  const current = document.body.classList.contains('light') ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  document.body.classList.remove('light', 'dark');
  document.body.classList.add(next);
  localStorage.setItem('sww_theme', next);
  toast(next === 'light' ? '☀️ Светлая тема' : '🌙 Тёмная тема', '🎨');
}

function toggleWinter() {
  if (!user.isAdmin) return;
  document.body.classList.toggle('winter');
  const on = document.body.classList.contains('winter');
  localStorage.setItem('sww_winter', on ? 'true' : 'false');
  if (on) createSnow();
  else removeSnow();
  toast(on ? '❄️ Зимняя тема включена' : '☀️ Обычная тема', '❄️');
}

function createSnow() {
  removeSnow();
  for (let i = 0; i < 30; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = ['❄', '❅', '❆', '•'][Math.floor(Math.random() * 4)];
    flake.style.left = Math.random() * 100 + '%';
    flake.style.animationDuration = (5 + Math.random() * 8) + 's';
    flake.style.animationDelay = Math.random() * 5 + 's';
    flake.style.fontSize = (10 + Math.random() * 14) + 'px';
    document.body.appendChild(flake);
  }
}
function removeSnow() {
  document.querySelectorAll('.snowflake').forEach(f => f.remove());
}

/* =========================================================
   СТАРТ
   ========================================================= */
window.addEventListener('load', async () => {
  const savedTheme = localStorage.getItem('sww_theme') || 'dark';
  if (savedTheme === 'light') document.body.classList.add('light');

  if (localStorage.getItem('sww_winter') === 'true') {
    document.body.classList.add('winter');
    createSnow();
  }

  loadAssortment();
  loadPromos();
  loadUsers();

  await initUser();

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.page));
  });

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
});
</script>

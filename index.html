<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>SWWSHOP — Ассортимент</title>
    <!-- Подключаем Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --accent: #0078ff;
        --border: #e0e0e0;
        --success: #2ecc71;
        --danger: #e74c3c;
        --admin-bg: #f4f6f8;
        --admin-border: #d1d5db;
        --admin-input: #ffffff;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .container {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }
      h1 {
        margin: 16px 0 12px 0;
        font-size: 20px;
        text-align: center;
        letter-spacing: 0.5px;
      }
      .shop-title {
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }
      .category-btn {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9f9f9;
        text-align: left;
        font-size: 16px;
        color: var(--text);
        cursor: pointer;
        transition: background 0.2s;
      }
      .category-btn:active {
        background: #eeeeee;
      }
      .product-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .product-name {
        font-weight: 500;
        word-break: break-word;
        max-width: 75%;
      }
      .product-price {
        font-weight: 600;
        color: var(--accent);
      }
      .status-badge {
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .status-in-stock {
        background: rgba(46, 204, 113, 0.1);
        color: var(--success);
      }
      .status-out-stock {
        background: rgba(231, 76, 60, 0.1);
        color: var(--danger);
      }
      .back-btn {
        margin-bottom: 8px;
        padding: 8px 12px;
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: 14px;
        cursor: pointer;
      }
      .flavor-row {
        padding: 10px 0;
        border-bottom: 1px dashed var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .section-title {
        margin-top: 16px;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 15px;
      }

      /* Стили админ-панели */
      .admin-panel {
        background: var(--admin-bg);
        padding: 16px;
        border-radius: 12px;
        position: absolute;
        bottom: 80px;
        left: 12px;
        right: 12px;
        max-height: calc(100% - 100px);
        overflow-y: auto;
        z-index: 1000;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        display: none; /* скрыто по умолчанию */
        transform-origin: bottom center;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .admin-panel.active {
        display: block;
      }
      .admin-login-form {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .admin-input {
        flex: 1;
        padding: 10px;
        border: 1px solid var(--admin-border);
        border-radius: 8px;
        background: var(--admin-input);
      }
      .admin-btn {
        padding: 10px 16px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .admin-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .admin-control-group {
        border: 1px solid var(--admin-border);
        padding: 12px;
        border-radius: 8px;
        background: var(--admin-input);
      }
      .admin-label {
        font-size: 13px;
        color: #666;
        margin-bottom: 4px;
        display: block;
      }
      .admin-textarea {
        width: 100%;

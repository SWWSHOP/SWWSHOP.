<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SWWSHOP</title>
  <!-- Подключаем SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --primary: #2481cc;
      --danger: #d32f2f;
      --success: #388e3c;
      --text: #111;
      --gray: #888;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tg-viewport {
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .category-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      font-size: 16px;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
      margin-bottom: 10px;
      cursor: pointer;
    }
    .category-btn:active {
      opacity: 0.85;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .product-name {
      font-weight: 600;
      line-height: 1.3;
    }
    .product-price {
      font-weight: 700;
      color: var(--primary);
    }
    .status-badge {
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
    }
    .status-in-stock {
      background-color: var(--success);
    }
    .status-out-of-stock {
      background-color: var(--danger);
    }
    .flavor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #eee;
    }
    .cart-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: var(--surface);
      box-shadow: 0 -4px 12px rgba(0,0,0,.1);
      z-index: 10;
    }
    .cart-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .promo-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .order-result {
      padding: 20px;
      text-align: center;
      display: none;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="tg-viewport">
  <div class="container">
    <h1>Ассортимент</h1>
    <div id="main-menu" class="menu-area">
      <button class="category-btn" data-cat="liquids">Жидкости</button>
      <button class="category-btn" data-cat="pouches">Шайбы</button>
      <button class="category-btn" data-cat="coils">Испарители</button>
      <button class="category-btn" data-cat="devices">Устройства</button>
    </div>

    <!-- Список товаров категории -->
    <div id="category-list" class="hidden"></div>

    <!-- Вкусы/позиции товара -->
    <div id="flavors-view" class="hidden">
      <button class="back-btn" id="back-from-flavors">← Назад к ассортименту</button>
      <div id="flavors-list"></div>
    </div>
  </div>

  <!-- Корзина и оплата -->
  <div id="cart-section" class="cart-section hidden">
    <div class="cart-info">
      <span id="cart-total-display">Корзина: 0 ₽</span>
      <span id="cart-count-display">0 товаров</span>
    </div>
    <input type="text" id="promo-code" class="promo-input" placeholder="Промокод (если есть)" />
    <button id="checkout-btn" class="checkout-btn">Оформить заказ</button>
  </div>

  <!-- Результат заказа -->
  <div id="order-result" class="order-result">
    <h2>Заказ оформлен!</h2>
    <p>Номер заказа: <strong id="order-number-display"></strong></p>
    <p id="order-details-display"></p>
    <br/>
    <button id="back-to-shop" class="category-btn">Вернуться в магазин</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // --- Данные товаров (как в ТЗ) ---
    const products = {
      liquids: [
        {
          id: 'alfa-50mg',
          name: 'ALFA VAPE 50MG',
          price: 350,
          flavors: [
            { name: 'Черничный лимонад', stock: 0, inStock: false },
            { name: 'Персик манго', stock: 4, inStock: true },
            { name: 'Вишневая кола', stock: 0, inStock: false },
            { name: 'Манго пинаколада', stock: 6, inStock: true },
            { name: 'Мармеладные мишки', stock: 3, inStock: true },
            { name: 'Леденцы лимонные', stock: 7, inStock: true },
            { name: 'Клубнично-банановая жвачка', stock: 2, inStock: true },
            { name: 'Энергетик киви яблоко', stock: 1, inStock: true },
            { name: 'Ананас малина', stock: 3, inStock: true },
            { name: 'Ягодный микс', stock: 0, inStock: false }
          ]
        },
        {
          id: 'isterika-70mg',
          name: 'ISTERIKA CLASSIC 70MG',
          price: 600,
          flavors: [
            { name: 'Ананас ежевика', stock: 1, inStock: true },
            { name: 'Арбузные леденцы', stock: 1, inStock: true },
            { name: 'Ежевичный мармелад', stock: 1, inStock: true },
            { name: 'Зелёный Бёрн', stock: 1, inStock: true },
            { name: 'Клубника банан дыня', stock: 1, inStock: true },
            { name: 'Клубника драгонфрут', stock: 1, inStock: true },
            { name: 'Клубника малиновое варенье', stock: 1, inStock: true },
            { name: 'Кола чупа чупс', stock: 1, inStock: true },
            { name: 'Лимонад черника', stock: 1, inStock: true },
            { name: 'Маракуйя грейпфрут', stock: 1, inStock: true },
            { name: 'Персик зеленый виноград', stock: 0, inStock: false },
            { name: 'Фруктовые мармеладные мишки', stock: 1, inStock: true },
            { name: 'Черная смородина груша', stock: 1, inStock: true },
            { name: 'Экзотик микс', stock: 1, inStock: true },
            { name: 'Яблоко лесной микс', stock: 1, inStock: true }
          ]
        }
      ],
      pouches: [
        {
          id: 'glitch-200mg',
          name: 'GLITCH POUCHES 200MG',
          price: 500,
          flavors: [
            { name: 'Двойное яблоко', stock: 1, inStock: true },
            { name: 'Фанта', stock: 1, inStock: true },
            { name: 'Баблгам', stock: 1, inStock: true }
          ]
        },
        {
          id: 'iceberg-150mg',
          name: 'ICEBERG EXTREME 150MG',
          price: 500,
          flavors: [
            { name: 'Манго банан', stock: 1, inStock: true }
          ]
        }
      ],
      coils: [
        { id: 'xros', name: 'XROS 0.6-0.4', price: 330, stock: 4, inStock: true },
        { id: 'hero', name: 'Hero 50-58W', price: 330, stock: 1, inStock: true },
        { id: 'pasito', name: 'Pasito K5', price: 330, stock: 2, inStock: true }
      ],
      devices: [] // пока пусто, можно добавить
    };

    // --- Корзина ---
    let cart = [];
    function updateCartUI() {
      const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      document.getElementById('cart-total-display').textContent = `Корзина: ${total.toLocaleString()} ₽`;
      document.getElementById('cart-count-display').textContent = `${cart.length} товаров`;
    }

    function addToCart(item) {
      const existing = cart.find(c => c.id === item.id);
      if (existing) {
        existing.qty += 1;
        // уменьшаем остаток (в памяти)
        item.stock -= 1;
        if (item.stock <= 0) item.inStock = false;
      } else {
        cart.push({ ...item, qty: 1 });
        item.stock -= 1;
        if (item.stock <= 0) item.inStock = false;
      }
      updateCartUI();
      renderCategoryList(); // обновить статусы
    }

    // --- Навигация и рендер ---
    function show(id) {
      document.querySelectorAll('.hidden').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        renderCategoryList(cat);
        show('category-list');
      });
    });

    function renderCategoryList(category) {
      const container = document.getElementById('category-list');
      container.innerHTML = '';

      if (category === 'coils' || category === 'devices') {
        // Для испарителей и устройств — сразу список товаров с кнопкой «в корзину»
        (products[category] || []).forEach(p => {
          const row = document.createElement('div');
          row.className = 'product-row';
          const statusClass = p.inStock ? 'status-in-stock' : 'status-out-of-stock';
          const statusText = p.inStock ? 'Имеется' : 'Кончилось';
          row.innerHTML = `
            <div>
              <div class="product-name">${p.name}</div>
              <div style="font-size:13px; color:var(--gray)">${statusText}</div>
            </div>
            <div style="text-align:right;">
              <div class="product-price">${p.price} ₽</div>
              ${p.inStock ? `<button class="checkout-btn" style="width:auto; padding:6px 12px;" onclick="addToCart(${JSON.stringify(p)})">В корзину</button>` : ''}
            </div>
          `;
          container.appendChild(row);
        });
      } else {
        // Для жидкостей и шайб — список товаров, по клику показываем вкусы
        (products[category] || []).forEach(p => {
          const row = document.createElement('div');
          row.className = 'product-row';
          row.innerHTML = `
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} ₽</div>
          `;
          row.onclick = () => {
            renderFlavors(p);
            show('flavors-view');
          };
          container.appendChild(row);
        });
      }
    }

    function renderFlavors(product) {
      const container = document.getElementById('flavors-list');
      container.innerHTML = '';
      product.flavors.forEach(f => {
        const row = document.createElement('div');
        row.className = 'flavor-row';
        const statusClass = f.inStock ? 'status-in-stock' : 'status-out-of-stock';
        const statusText = f.inStock ? 'Имеется' : 'Кончилось';
        row.innerHTML = `
          <div>
            <div class="product-name">${f.name}</div>
            <div style="font-size:12px; color:var(--gray)">${statusText}</div>
          </div>
          ${f.inStock ? `<button class="checkout-btn" style="width:auto; padding:4px 8px;" onclick="addToCart(${JSON.stringify({...f, id: product.id + '-' + f.name, name: f.name, price: product.price})})">В корзину</button>` : ''}
        `;
        container.appendChild(row);

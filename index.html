<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SWWSHOP — Ассортимент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --accent: #0078ff;
      --border: #e0e0e0;
      --success: #2ecc71;
      --danger: #e74c3c;
      --warning: #f39c12;
      --admin-bg: #f4f6f8;
      --admin-border: #d1d5db;
      --card-bg: #f9f9f9;
      --card-active: #eeeeee;
    }
    
    body.dark {
      --bg: #1a1a1a;
      --text: #ffffff;
      --accent: #4da3ff;
      --border: #333333;
      --admin-bg: #2a2a2a;
      --admin-border: #444444;
      --card-bg: #2a2a2a;
      --card-active: #3a3a3a;
    }
    
    body.telegram {
      --bg: #18222d;
      --text: #ffffff;
      --accent: #5ea3d9;
      --border: #1f2d3d;
      --admin-bg: #1e2a38;
      --admin-border: #2a3a4a;
      --card-bg: #1e2a38;
      --card-active: #253545;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    .container { flex: 1; overflow-y: auto; padding: 12px 12px 100px; }
    h1 { margin: 16px 0 12px; font-size: 20px; text-align: center; }
    .shop-title { text-transform: uppercase; color: var(--accent); font-weight: 700; }
    
    .category-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      text-align: left;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
    }
    .category-btn:active { background: var(--card-active); }
    .category-btn svg { margin-right: 12px; flex-shrink: 0; }
    
    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 4px;
    }
    .product-name { font-weight: 500; max-width: 45%; min-width: 100px; font-size: 14px; }
    .product-price { font-weight: 600; color: var(--accent); font-size: 14px; }
    .status-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
    .status-in-stock { background: rgba(46,204,113,0.15); color: var(--success); }
    .status-out-stock { background: rgba(231,76,60,0.15); color: var(--danger); }
    .back-btn {
      margin-bottom: 8px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
    }
    .flavor-row {
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .section-title { margin-top: 16px; margin-bottom: 8px; font-weight: 600; font-size: 15px; }
    
    .add-to-cart-btn {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      margin-left: 8px;
      white-space: nowrap;
    }
    .add-line-to-cart-btn {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    
    .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn-sm {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: white;
      font-weight: 500;
    }
    .btn-delete { background: var(--danger); }
    .btn-toggle { background: var(--warning); }
    .btn-delete-line {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    .btn-delete-flavor {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .cart-icon {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1001;
      background: var(--success);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46,204,113,0.4);
      border: none;
      font-size: 20px;
    }
    .cart-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--danger);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    
    .cart-panel {
      background: var(--admin-bg);
      padding: 16px;
      border-radius: 12px;
      position: fixed;
      top: 70px;
      left: 12px;
      right: 12px;
      bottom: 80px;
      overflow-y: auto;
      z-index: 999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      display: none;
    }
    .cart-panel.active { display: block; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 500; font-size: 14px; }
    .cart-item-detail { font-size: 12px; opacity: 0.7; }
    .cart-item-price { color: var(--accent); font-weight: 600; white-space: nowrap; }
    .cart-remove-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .cart-total {
      font-size: 18px;
      font-weight: 700;
      text-align: right;
      margin: 12px 0;
      color: var(--accent);
    }
    .cart-empty { text-align: center; opacity: 0.5; padding: 20px; }
    
    .order-form { margin-top: 16px; }
    .order-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .order-btn {
      width: 100%;
      padding: 14px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .order-success {
      text-align: center;
      padding: 20px;
      color: var(--success);
      font-weight: 600;
      font-size: 16px;
    }

    .admin-panel {
      background: var(--admin-bg);
      padding: 16px;
      border-radius: 12px;
      position: fixed;
      bottom: 80px;
      left: 12px;
      right: 12px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      display: none;
    }
    .admin-panel.active { display: block; }
    .admin-login-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
      font-family: inherit;
    }
    .admin-btn {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .admin-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 500px) { .admin-controls { grid-template-columns: 1fr; } }
    .admin-control-group {
      border: 1px solid var(--admin-border);
      padding: 12px;
      border-radius: 8px;
      background: var(--card-bg);
      margin-bottom: 12px;
    }
    .admin-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: block; opacity: 0.8; }
    .admin-textarea {
      width: 100%;
      height: 60px;
      resize: vertical;
      padding: 8px;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      margin-bottom: 8px;
      font-family: inherit;
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text);
    }
    .admin-action-btn {
      width: 100%;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-dark { background: #333; }
    .btn-red { background: var(--danger); }
    .btn-orange { background: var(--warning); }
    .admin-logout-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .admin-toggle-btn {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 50%;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,170,0,0.4);
      z-index: 998;
    }
    .admin-toggle-btn svg { width: 28px; height: 28px; }
    
    .theme-switcher {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 6px;
      z-index: 998;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: all 0.2s;
      padding: 0;
      color: var(--text);
    }
    .theme-btn.active { border-color: var(--accent); background: rgba(0,120,255,0.15); }
    
    .delete-section { border: 2px solid var(--danger) !important; }
    .delete-select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-family: inherit;
    }
    .admin-indicator {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #333;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001;
      display: none;
    }
    .admin-indicator.active { display: block; }
  </style>
</head>
<body class="telegram">
  <div class="admin-indicator" id="admin-indicator">АДМИН</div>
  
  <button class="cart-icon" onclick="toggleCart()" title="Корзина">
    🛒
    <span class="cart-count" id="cart-count" style="display:none;">0</span>
  </button>
  
  <div class="container" id="app"><p style="text-align:center;padding:40px;">Загрузка...</p></div>

  <div id="cart-panel" class="cart-panel">

    </div>
    <div id="cart-items"><p class="cart-empty">Корзина пуста</p></div>
    <div class="cart-total" id="cart-total"></div>
    
    <div class="order-form" id="order-form" style="display:none;">
      <input type="text" id="customer-name" placeholder="Ваше имя *" />
      <input type="text" id="customer-contact" placeholder="Телефон или @username *" />
      <button class="order-btn" onclick="sendOrder()">Оформить заказ</button>
      <p style="font-size:11px;opacity:0.6;text-align:center;margin-top:8px;">После оформления с вами свяжутся</p>
    </div>
    <div class="order-success" id="order-success" style="display:none;">
      ✅ Заказ отправлен!<br>С вами свяжутся в ближайшее время.
    </div>
  </div>

  <button class="admin-toggle-btn" onclick="toggleAdminPanel()" title="Админ-панель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" fill="#333" stroke="#333"/>

      <path d="M18 7v4l-3 3" stroke="#ffd700"/>
    </svg>
  </button>

  <div class="theme-switcher">
    <button class="theme-btn active" onclick="setTheme('telegram')">🌙</button>
    <button class="theme-btn" onclick="setTheme('light')">☀️</button>
    <button class="theme-btn" onclick="setTheme('dark')">🌑</button>
  </div>

  <div id="admin-panel" class="admin-panel">
    <h2 class="shop-title">Админ-панель</h2>
    
    <div id="admin-login-area">
      <p style="font-size:12px;color:var(--text);opacity:0.7;margin-bottom:16px;">Введите пароль</p>
      <div class="admin-login-form">
        <input type="password" id="admin-password" class="admin-input" placeholder="Пароль" onkeypress="if(event.key==='Enter')adminLogin()" />
        <button class="admin-btn" onclick="adminLogin()">Войти</button>
      </div>
    </div>
    
    <div id="admin-controls-area" style="display:none;">
      <div class="admin-controls">
        <div class="admin-control-group">
          <span class="admin-label">Добавить линейку</span>
          <input type="text" id="line-name" class="admin-input" placeholder="Название" />
          <input type="number" id="line-price" class="admin-input" placeholder="Цена" />
          <select id="line-category" class="admin-input">
            <option value="liquids">Жидкости</option>
            <option value="pouches">Шайбы</option>
          </select>

        <div class="admin-control-group">
          <span class="admin-label">Добавить товар</span>
          <input type="text" id="item-name" class="admin-input" placeholder="Название" />
          <input type="number" id="item-price" class="admin-input" placeholder="Цена" />
          <select id="item-category" class="admin-input">

          <button class="admin-action-btn btn-dark" onclick="addItem()">Добавить</button>
        </div>
      </div>
      
      <div class="admin-control-group delete-section">
        <span class="admin-label" style="color:var(--danger);">Удаление</span>
        <select id="del-category" class="delete-select" onchange="updateDelSelect()">
          <option value="liquids">Жидкости</option>
          <option value="pouches">Шайбы</option>
          <option value="coils">Испарители</option>
          <option value="devices">Устройства</option>

      <button class="admin-logout-btn" onclick="adminLogout()">Выйти</button>

    function refreshView() {
      if (currentView === 'main') showMain();
      else if (currentView === 'category') showCategory(currentCategory);
      else if (currentView === 'detail') showDetail(currentCategory, currentIndex);
    }

    function stText(s) { return s ? 'В наличии' : 'Нет'; }
    function stClass(s) { return s ? 'status-in-stock' : 'status-out-stock'; }
    
    // ============ КОРЗИНА ============
    function saveCart() { localStorage.setItem('swwshop_cart', JSON.stringify(cart)); updateCartBadge(); }
    
    function updateCartBadge() {
      const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
      const el = document.getElementById('cart-count');
      if (count > 0) { el.style.display = 'flex'; el.textContent = count; }
      else { el.style.display = 'none'; }
    }

    function addToCart(name, price, lineName, flavorName) {
      cart.push({ id: Date.now(), name, price, lineName: lineName || '', flavorName: flavorName || '', quantity: 1 });
      saveCart();
      alert('Добавлено в корзину!');
    }

    function removeFromCart(index) { cart.splice(index, 1); saveCart(); showCart(); }

    function toggleCart() {
      const panel = document.getElementById('cart-panel');
      document.getElementById('admin-panel').classList.remove('active');
      panel.classList.toggle('active');
      if (panel.classList.contains('active')) showCart();
    }

    function showCart() {
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      const formEl = document.getElementById('order-form');
      document.getElementById('order-success').style.display = 'none';
      
      if (cart.length === 0) {
        itemsEl.innerHTML = '<p class="cart-empty">Корзина пуста</p>';
        totalEl.textContent = '';
        formEl.style.display = 'none';
        return;
      }

      let total = 0;
      let html = '';
      cart.forEach((item, i) => {
        total += item.price * item.quantity;
        html += `<div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            ${item.flavorName ? `<div class="cart-item-detail">Вкус: ${item.flavorName}</div>` : ''}
            ${item.lineName && !item.flavorName ? `<div class="cart-item-detail">${item.lineName}</div>` : ''}
          </div>
          <span class="cart-item-price">${item.price} RUB</span>
          <button class="cart-remove-btn" onclick="removeFromCart(${i})">×</button>
        </div>`;
      });

      itemsEl.innerHTML = html;
      totalEl.textContent = `Итого: ${total} RUB`;
      formEl.style.display = 'block';
    }

    async function sendOrder() {
      const name = document.getElementById('customer-name').value.trim();
      const contact = document.getElementById('customer-contact').value.trim();
      
      if (!name) return alert('Введите имя!');
      if (!contact) return alert('Введите телефон или @username!');
      
      let total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      let orderText = `🛒 НОВЫЙ ЗАКАЗ\n\n`;
      orderText += `👤 Имя: ${name}\n`;
      orderText += `📱 Контакты: ${contact}\n\n`;
      orderText += `📋 Товары:\n`;
      cart.forEach((item, i) => {
        orderText += `${i + 1}. ${item.name}`;
        if (item.flavorName) orderText += ` - ${item.flavorName}`;
        orderText += ` - ${item.price}₽\n`;
      });
      orderText += `\n💰 Итого: ${total}₽\n`;
      orderText += `📅 ${new Date().toLocaleString()}`;
      
      try {
        const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: orderText
          })
        });
        
        const result = await resp.json();
        
        if (result.ok) {
          cart = [];
          saveCart();
          document.getElementById('cart-items').innerHTML = '';
          document.getElementById('cart-total').textContent = '';
          document.getElementById('order-form').style.display = 'none';
          document.getElementById('order-success').style.display = 'block';
          setTimeout(() => { document.getElementById('cart-panel').classList.remove('active'); }, 3000);
        } else {
          alert('Ошибка отправки: ' + (result.description || 'Попробуйте ещё раз'));
        }
      } catch(e) {
        alert('Ошибка соединения. Проверьте интернет.');
      }
    }
